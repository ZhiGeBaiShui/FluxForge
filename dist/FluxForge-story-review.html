s.cs"],"system":false,"options":[]}},"chapters":[{"title":"01 / 流源工艺初体验","npc":"oya","entry":"oya-start","trigger":"奥雅每7天确定来访；入门剧情尚未完成。首次来访播放完整介绍，之后仍未完成时播放简短邀请。拒绝体验不会标记入门完成。","source":"src/Story/Npcs/FlowEmitterMerchant/FlowEmitterMerchantStory.cs","priority":100},{"title":"02 / 奥雅第二阶段到访","npc":"oya","entry":"oya-second","trigger":"入门剧情已完成，第二阶段到访剧情尚未完成；事件只正常完成一次。每7天的奥雅来访规则不变。","source":"src/Story/Npcs/FlowEmitterMerchant/FlowEmitterMerchantStory.cs","priority":90},{"title":"03 / 奥雅日常售卖","npc":"oya","entry":"oya-generic","trigger":"每7天到访；没有命中优先级更高的入门或第二阶段剧情时。","source":"src/Story/Npcs/FlowEmitterMerchant/FlowEmitterMerchantStory.cs","priority":10},{"title":"04 / 薇拉首次到访","npc":"vera","entry":"vera-first","trigger":"奥雅入门剧情完成后，薇拉可每7天确定来访；尚未正常完成薇拉初访。若同时命中更高优先级医院事件，先由医院事件接管。","source":"src/Story/Npcs/AcidBuyer/AcidBuyerStory.cs","priority":100},{"title":"05 / 薇拉日常收购","npc":"vera","entry":"vera-repeat","trigger":"薇拉每7天来访的兜底事件；未命中合同提议、合同送料、取货、里程碑或终止事件。","source":"src/Story/Npcs/AcidBuyer/AcidBuyerStory.cs","priority":10},{"title":"06 / 医院合同提议","npc":"vera","entry":"offer","trigger":"高浓度问答已完成并排队合同提议；尚未签约，且没有永久拒绝。下次符合来访条件时触发。优先级150。","source":"src/Story/Npcs/AcidBuyer/AcidBuyerStory.cs","priority":150},{"title":"07 / 再次询问合同","npc":"vera","entry":"offer-repeat","trigger":"先前暂时只散卖，合同提议仍排队；下次7天来访。已正常结束过合同提议，或曾解释过合同详情。","source":"src/Story/Hospital/Events/HospitalContractOffer/HospitalContractOfferEdges.cs","priority":null},{"title":"08 / 医院每周收货","npc":"vera","entry":"pickup","trigger":"合同有效且到达约定收货星期；签约后第7天首次收货。跳天不会改成任意日期补收。","source":"src/Story/Hospital/HospitalContractSchedule.cs","priority":200},{"title":"09 / 医院每周送料","npc":"vera","entry":"material","trigger":"合同有效且到达送料星期。","source":"src/Story/Hospital/HospitalContractSchedule.cs","priority":190},{"title":"20声望额度提示","npc":"vera","entry":"rep20","trigger":"只在正常送料的 MaterialDelivered 插入点提示一次，不单独占用收货日。","source":"src/Story/Npcs/AcidBuyer/AcidBuyerStory.cs","priority":null},{"title":"40声望额度提示","npc":"vera","entry":"rep40","trigger":"只在正常送料的 MaterialDelivered 插入点提示一次，不单独占用收货日。","source":"src/Story/Npcs/AcidBuyer/AcidBuyerStory.cs","priority":null},{"title":"12 / 60声望最高需求","npc":"vera","entry":"demand","trigger":"声望≥60且从未接受/拒绝，在医院收货日替换普通问候；不在送料日邀请。","source":"src/Story/Hospital/Events/HospitalHighestDemand/HospitalHighestDemand.cs","priority":null},{"title":"14 / 医院最终主线","npc":"vera","entry":"syn-offer","trigger":"60声望任务已完成、医院声望≥100、从未接受/拒绝；在非送料且非收货的空闲日到访。","source":"src/Story/Hospital/Events/HospitalSynaprest/Services/HospitalSynaprestState.cs","priority":270},{"title":"14 / 合同终止","npc":"vera","entry":"termination","trigger":"合同已开始、尚未终止，医院声望≤-20；优先级300，高于里程碑和日常合同事件。只正常完成一次。","source":"src/Story/Npcs/AcidBuyer/AcidBuyerStory.cs","priority":300},{"title":"15 / 医院采购访客 01","npc":"visitor1","entry":"visitor1","trigger":"医院80声望“特殊采购”已解锁；每日顾客生成时整体10%概率追加一位，随机挑选4个已注册身份之一。","source":"src/Story/Hospital/Procurement/Services/HospitalProcurementClients.cs","priority":null},{"title":"16 / 医院采购访客 02","npc":"visitor2","entry":"visitor2","trigger":"医院80声望“特殊采购”已解锁；每日顾客生成时整体10%概率追加一位，随机挑选4个已注册身份之一。","source":"src/Story/Hospital/Procurement/Services/HospitalProcurementClients.cs","priority":null},{"title":"17 / 医院采购访客 03","npc":"visitor3","entry":"visitor3","trigger":"医院80声望“特殊采购”已解锁；每日顾客生成时整体10%概率追加一位，随机挑选4个已注册身份之一。","source":"src/Story/Hospital/Procurement/Services/HospitalProcurementClients.cs","priority":null},{"title":"18 / 医院采购访客 04","npc":"visitor4","entry":"visitor4","trigger":"医院80声望“特殊采购”已解锁；每日顾客生成时整体10%概率追加一位，随机挑选4个已注册身份之一。","source":"src/Story/Hospital/Procurement/Services/HospitalProcurementClients.cs","priority":null}],"rules":[{"title":"来访调度与剧情优先级","body":"未签约时普通来访7天冷却；有效合同期间按固定送料/收货星期来访。20/40额度提示是送料插入。100声望请求需要60任务完成且当天无送料、收货。","source":["src/Story/Npcs/AcidBuyer/AcidBuyerStory.cs","src/Story/Npcs/FlowEmitterMerchant/FlowEmitterMerchantStory.cs"]},{"title":"散卖计价与高浓度累计","body":"整瓶浓度≥90%的酸/碱才收。基础价格为每10 mL 1信用点（每瓶向下取整）；90%至99%基础倍率1，99%以上每提高0.1个百分点倍率+0.1，100%倍率3。高浓度问答只需本次出现≥99%交付且从未问答；告别好评另要求本次各批≥99%货物累计≥100 mL。","source":["src/Story/Npcs/AcidBuyer/AcidBuyerTrade.cs","src/Story/Npcs/AcidBuyer/AcidBuyerTradeSession.cs"]},{"title":"医院合同计分、货款和声望","body":"酸/碱基础分1，酒精0.8；最低浓度90%；得分=整瓶mL×品类基础分×浓度权重。90%至99%权重1，99%以上每0.1个百分点+0.1，100%权重3。周目标300分，600分触发超额感谢。基础货款=floor(得分×0.1)；结算前声望≥60时再floor(基础货款×1.2)。达标声望=min(floor(得分/100),20)；不足为-ceil((300-得分)/100)，零交付-3；声望≥100且不足时不减声望。所有提交分数在结束时统一付款。","source":["src/Story/Hospital/HospitalContractScore.cs","src/Story/Hospital/HospitalContractTrade.cs"]},{"title":"声望奖励","body":"20：原料3瓶；40：4瓶；60：周货款1.2倍；80：医院采购访客每日10%机会；100：外聘专家，不足或零交付不减声望。医院550mL原液提纯主线已实现；奥雅黑针配方与原液合成路线待后续设计。","source":["src/Story/Hospital/HospitalReputation.cs","src/Story/Hospital/HospitalReputationTexts.cs"]},{"title":"审阅页的条件不是玩家选项","body":"页面中“玩家选项”来自游戏剧情；“条件分支”“继续”“阅读清单”等为审阅导航。点击选项只展开它可能出现的条件，再点击条件进入目标剧情。本页不模拟真实存档、桌面物品或付款，返回不会重复发放物品。台词保留源码原文，包括标点与变量；源码中的系统颜色标记仅用于文本展示。","source":[]}],"portraits":{"oya":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAACgCAYAAACLz2ctAABgWElEQVR4nO29d5wlZ3UtuiucczpO90xP0EgjjaQZzYyEAkqjiDHRJnOBAZsoMs8kXweCL9fXNs8mZwvb2BYgw8MXgS2SkUkmCIGyQFkohwma2LlPqPreb62991fVMr/3e39cz3S3VDDq7hPq1Knatb+91157bZHHtse2Q7glh/LDF9v2vC1ndyQJKU5akESSRKQMZe0k4rFEQij5exA8l/HvEESyJAmX3nZlS0Twgsc2EckfOwv//7ckTSSFuSW0LilDkDzNhNalr7BbOuVfQTIapIRUilIkJI/Z3SO3xzzgr9n+2wlnfy9N0+UhSZJUQn8Skh5sL03C5oTGF+SMI0fVw8HjwdhC0N/LIGmWSkY/mUhZFpImiXz/jn18vpkmD/Yk7O11ik9+41dXf04e5dtjHvDXbJ0iPCkNvZBKKoH/U5fX18xgkLxt81SXXnjBNBUaHg0wDZIm+AcPqM/BjNVMRbplWFeIrJMkvEhEHjPAg23xC3TL18v6/HhphKNOH1kz1Q6SZI0ExgO7gflkGbxXkB4MDsuqLckZ7Qqv5+IswmVXPSLeWUiJKFBauT1OrwjP2Thqo2xsidwpA2vW5Ee2Vje/df+N++VRtj22BIvI8084e64Xyhwnoz/Pk7MO66NBBQ/34PQSoRHidzyep5pw0LEl6iP5B18LP1nKzbvn6EPVYIOUJTymvr9XBNk10ZFSypDAX4ay/MbtVzd1J4fcJg7aMTzaPWC+TSTtSMjzJElaWZCQBMmaqRodrkUI0mhkUmJBtTjP0mDphVKaGbJcv2aWhHDFTSVXw6NVwvAYFdJw9eE04XVOmCWLJNtEGiJSXCJSHMJzclBvgEetB3zK4VvG+kdGdiFO27iiL0mTVJ59/ErJ+puM67hYwlISkUuu2i5JKlLCimBfhF/0Uj1uzYBoZGgP4L9JmqixMoqkAcJHZonIL3ZMmZ2mCuPALeKBIoT7x9tlImWyQDzhQdkUL3gUbgOtPE9gJDAzOLqylKzV4NKJJR       HospitalContractMaterialEdge material\n                = new HospitalContractMaterialEdge();\n            material.Connect(null, null);\n            _entry = material;\n        }\n\n        internal override StoryEdge Entry\n        {\n            get { return _entry; }\n        }\n    }\n}\n","src/Story/Hospital/Events/HospitalContractMaterial/HospitalContractMaterialEdges.cs":"using FluxForge.Mod;\n\nnamespace FluxForge.Story.Hospital\n{\n    /// <summary>到期送料：无玩家选项；问候行结束后发放原料、推进日期，再检查插入剧情。<\/summary>\n    internal sealed class HospitalContractMaterialEdge : StoryEdge\n    {\n        internal HospitalContractMaterialEdge()\n            : base(null, null)\n        {\n        }\n\n        internal override void Execute(StorySequence player)\n        {\n            Append(player);\n        }\n\n        internal static void Append(StorySequence player)\n        {\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractMaterialTexts.Greeting));\n            player.Do(delegate\n            {\n                HospitalContractStock.GiveWeekly(\n                    HospitalContractStock.WeeklyCount());\n                if (HospitalSynaprestState.Completed)\n                {\n                    HospitalSynaprestStock.GiveWeekly();\n                }\n                HospitalContractState.MarkMaterial(\n                    StoreStation.GetDayCounter());\n            });\n            player.Insert(HospitalStoryPoints.MaterialDelivered);\n        }\n    }\n}\n","src/Story/Hospital/Events/HospitalContractMaterial/HospitalContractMaterialTexts.cs":"namespace FluxForge.Story.Hospital\n{\n    internal static class HospitalContractMaterialTexts\n    {\n        internal const string Greeting\n            = \"story.HospitalContractMaterialTexts.Greeting\";\n    }\n}\n","src/Story/Hospital/Events/HospitalContractMilestone/HospitalContractMilestoneAssembly.cs":"namespace FluxForge.Story.Hospital\n{\n    internal sealed class HospitalContractMilestoneAssembly : StoryAssembly\n    {\n        private readonly StoryEdge _entry;\n\n        internal HospitalContractMilestoneAssembly(int tier)\n        {\n            HospitalContractMilestoneEdge milestone\n                = new HospitalContractMilestoneEdge(tier);\n            milestone.Connect(null, null);\n            _entry = milestone;\n        }\n\n        internal override StoryEdge Entry\n        {\n            get { return _entry; }\n        }\n    }\n}\n","src/Story/Hospital/Events/HospitalContractMilestone/HospitalContractMilestoneEdges.cs":"\nnamespace FluxForge.Story.Hospital\n{\n    internal sealed class HospitalContractMilestoneEdge : StoryEdge\n    {\n        private readonly int _tier;\n\n        internal HospitalContractMilestoneEdge(int tier)\n            : base(null, null)\n        {\n            _tier = tier;\n        }\n\n        internal override void Execute(StorySequence player)\n        {\n            if (_tier >= 40)\n            {\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractMilestoneTexts.At40_1));\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractMilestoneTexts.At40_2));\n            }\n            else\n            {\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractMilestoneTexts.At20_1));\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractMilestoneTexts.At20_2));\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractMilestoneTexts.At20_3));\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractMilestoneTexts.At20_4));\n            }\n\n\n        }\n    }\n}\n","src/Story/Hospital/Events/HospitalContractMilestone/HospitalContractMilestoneTexts.cs":"namespace FluxForge.Story.Hospital\n{\n    internal static class HospitalContractMilestoneTexts\n    {\n        internal const string At20_1\n            = \"story.HospitalContractMilestoneTexts.At20_1\";\n\n        internal const string At20_2\n            = \"story.HospitalContractMilestoneTexts.At20_2\";\n\n        internal const string At20_3\n            = \"story.HospitalContractMilestoneTexts.At20_3\";\n\n        internal const string At20_4\n            = \"story.HospitalContractMilestoneTexts.At20_4\";\n\n        internal const string At40_1\n            = \"story.HospitalContractMilestoneTexts.At40_1\";\n\n        internal const string At40_2\n            = \"story.HospitalContractMilestoneTexts.At40_2\";\n    }\n}\n","src/Story/Hospital/Events/HospitalContractOffer/HospitalContractOfferAssembly.cs":"using FluxForge.Story.AcidBuyer;\nusing FluxForge.Story.AcidBuyerRepeatVisit;\n\nnamespace FluxForge.Story.Hospital\n{\n    internal sealed class HospitalContractOfferAssembly : StoryAssembly\n    {\n        internal const string EventId = \"acid_buyer.contract_offer\";\n\n        private readonly StoryEdge _entry;\n\n        internal HospitalContractOfferAssembly(IStoryState state)\n        {\n            AcidBuyerTradeSession session = new AcidBuyerTradeSession();\n            StoryNode selling = AcidBuyerRepeatVisitAssembly.CreateTradeOptions(session);\n            var first = CreateOptions(selling, HospitalContractOfferTexts.DeclineOption);\n            var repeat = CreateOptions(selling, HospitalContractOfferTexts.RepeatDeclineOption);\n            HospitalContractOfferGreetingEdge greeting\n                = new HospitalContractOfferGreetingEdge(session, state);\n            greeting.SetTargets(first.Root, repeat.Root, repeat.AfterAsk);\n            greeting.Connect(null, first.Root);\n            _entry = greeting;\n        }\n\n        private static (StoryNode Root, StoryNode AfterAsk) CreateOptions(\n            StoryNode selling, string declineLabel)\n        {\n            StoryNode root = new StoryNode();\n            StoryNode afterAsk = new StoryNode();\n            new HospitalContractOfferAskEdge().Connect(root, afterAsk);\n            new HospitalContractOfferDeclineEdge(declineLabel).Connect(root, selling);\n            new HospitalContractOfferNoInterestEdge().Connect(root, selling);\n\n            new HospitalContractOfferAcceptEdge().Connect(afterAsk, null);\n            new HospitalContractOfferDeclineEdge(declineLabel).Connect(afterAsk, selling);\n            new HospitalContractOfferNoInterestEdge().Connect(afterAsk, selling);\n            return (root, afterAsk);\n        }\n\n        internal override StoryEdge Entry\n        {\n            get { return _entry; }\n        }\n    }\n}\n","src/Story/Hospital/Events/HospitalContractOffer/HospitalContractOfferEdges.cs":"using FluxForge.Mod;\nusing FluxForge.Story.AcidBuyer;\n\nnamespace FluxForge.Story.Hospital\n{\n    internal sealed class HospitalContractOfferGreetingEdge : StoryEdge\n    {\n        private readonly AcidBuyerTradeSession _session;\n        private readonly IStoryState _state;\n        private StoryNode _firstRoot;\n        private StoryNode _repeatRoot;\n        private StoryNode _repeatAfterAsk;\n        private StoryNode _next;\n\n        internal HospitalContractOfferGreetingEdge(\n            AcidBuyerTradeSession session, IStoryState state)\n            : base(null, null)\n        {\n            _session = session;\n            _state = state;\n        }\n\n        internal void SetTargets(\n            StoryNode firstRoot,\n            StoryNode repeatRoot,\n            StoryNode repeatAfterAsk)\n        {\n            _firstRoot = firstRoot;\n            _repeatRoot = repeatRoot;\n            _repeatAfterAsk = repeatAfterAsk;\n        }\n\n        internal override StoryNode ResolveNext()\n        {\n            return _next;\n        }\n\n        internal override void Execute(StorySequence player)\n        {\n            _session.BeginVisit();\n            if (_state.SeenCount(HospitalContractOfferAssembly.EventId) > 0\n                || HospitalContractState.DetailsExplained)\n            {\n                _next = HospitalContractState.DetailsExplained\n                    ? _repeatAfterAsk : _repeatRoot;\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractOfferTexts.RepeatGreeting1));\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractOfferTexts.RepeatGreeting2));\n            }\n            else\n            {\n                _next = _firstRoot;\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractOfferTexts.Greeting1));\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractOfferTexts.Greeting2));\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractOfferTexts.Greeting3));\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractOfferTexts.Greeting4));\n            }\n        }\n    }\n\n    internal sealed class HospitalContractOfferAskEdge : StoryEdge\n    {\n        private const string PriceBody = \"paper.contract.body\";\n\n        internal HospitalContractOfferAskEdge()\n            : base(HospitalContractOfferTexts.AskOption, \"question\")\n        {\n        }\n\n        internal override void Execute(StorySequence player)\n        {\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractOfferTexts.AskLine1));\n            player.Do(delegate\n            {\n                PlayerStore.Instance.AddDirectSellingItemToTable(\n                    CreatePriceNote(),\n                    true);\n                HospitalContractState.MarkDetailsExplained();\n            });\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractOfferTexts.AskLine2));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractOfferTexts.AskLine3));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractOfferTexts.AskLine4));\n        }\n\n        private static GameItem CreatePriceNote()\n        {\n            GameItem note = PreBuiltItemHelper.CreateHandnote(\n                ModHelper.GetLocalized(\"fluxforge\", PriceBody),\n                ModHelper.GetLocalized(\"fluxforge\", \"paper.contract.title\"),\n                ModHelper.GetLocalized(\"fluxforge\", \"npc.vera.name\"),\n                2);\n            note.name = ModHelper.GetLocalized(\"fluxforge\", \"paper.contract.title\");\n            note.shortDescription = ModHelper.GetLocalized(\"fluxforge\", \"paper.contract.description\");\n            note.unitValue = 0L;\n            return note;\n        }\n    }\n\n    internal sealed class HospitalContractOfferAcceptEdge : StoryEdge\n    {\n        internal HospitalContractOfferAcceptEdge()\n            : base(HospitalContractOfferTexts.AcceptOption, \"question\")\n        {\n        }\n\n        internal override void Execute(StorySequence player)\n        {\n            HospitalContractState.Start(StoreStation.GetDayCounter());\n            HospitalReputation.EnsureFaction();\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractOfferTexts.AcceptLine1));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractOfferTexts.AcceptLine2));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractOfferTexts.AcceptLine3));\n        }\n    }\n\n    internal sealed class HospitalContractOfferDeclineEdge : StoryEdge\n    {\n        internal HospitalContractOfferDeclineEdge(string label)\n            : base(label, \"question\")\n        {\n        }\n\n        internal override void Execute(StorySequence player)\n        {\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractOfferTexts.DeclineLine));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractOfferTexts.ResumeTrade));\n        }\n    }\n\n    internal sealed class HospitalContractOfferNoInterestEdge : StoryEdge\n    {\n        internal HospitalContractOfferNoInterestEdge()\n            : base(HospitalContractOfferTexts.NoInterestOption, \"question\")\n        {\n        }\n\n        internal override void Execute(StorySequence player)\n        {\n            HospitalContractState.DeclineOffer();\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractOfferTexts.NoInterestLine1));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractOfferTexts.NoInterestLine2));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractOfferTexts.ResumeTrade));\n        }\n    }\n}\n","src/Story/Hospital/Events/HospitalContractOffer/HospitalContractOfferTexts.cs":"namespace FluxForge.Story.Hospital\n{\n    internal static class HospitalContractOfferTexts\n    {\n        internal const string ResumeTrade\n            = \"story.HospitalContractOfferTexts.ResumeTrade\";\n\n        internal const string Greeting1\n            = \"story.HospitalContractOfferTexts.Greeting1\";\n\n        internal const string Greeting2\n            = \"story.HospitalContractOfferTexts.Greeting2\";\n\n        internal const string Greeting3\n            = \"story.HospitalContractOfferTexts.Greeting3\";\n\n        internal const string Greeting4\n            = \"story.HospitalContractOfferTexts.Greeting4\";\n\n        internal const string RepeatGreeting1\n            = \"story.HospitalContractOfferTexts.RepeatGreeting1\";\n\n        internal const string RepeatGreeting2\n            = \"story.HospitalContractOfferTexts.RepeatGreeting2\";\n\n        internal const string AskOption\n            = \"story.HospitalContractOfferTexts.AskOption\";\n\n        internal const string AcceptOption\n            = \"story.HospitalContractOfferTexts.AcceptOption\";\n\n        internal const string DeclineOption\n            = \"story.HospitalContractOfferTexts.DeclineOption\";\n\n        internal const string RepeatDeclineOption\n            = \"story.HospitalContractOfferTexts.RepeatDeclineOption\";\n\n        internal const string NoInterestOption\n            = \"story.HospitalContractOfferTexts.NoInterestOption\";\n\n        internal const string AskLine1\n            = \"story.HospitalContractOfferTexts.AskLine1\";\n\n        internal const string AskLine2\n            = \"story.HospitalContractOfferTexts.AskLine2\";\n\n        internal const string AskLine3\n            = \"story.HospitalContractOfferTexts.AskLine3\";\n\n        internal const string AskLine4\n            = \"story.HospitalContractOfferTexts.AskLine4\";\n\n        internal const string AcceptLine1\n            = \"story.HospitalContractOfferTexts.AcceptLine1\";\n\n        internal const string AcceptLine2\n            = \"story.HospitalContractOfferTexts.AcceptLine2\";\n\n        internal const string AcceptLine3\n            = \"story.HospitalContractOfferTexts.AcceptLine3\";\n\n        internal const string DeclineLine\n            = \"story.HospitalContractOfferTexts.DeclineLine\";\n\n        internal const string NoInterestLine1\n            = \"story.HospitalContractOfferTexts.NoInterestLine1\";\n\n        internal const string NoInterestLine2\n            = \"story.HospitalContractOfferTexts.NoInterestLine2\";\n    }\n}\n","src/Story/Hospital/Events/HospitalContractPickup/HospitalContractPickupAssembly.cs":"namespace FluxForge.Story.Hospital\n{\n    internal sealed class HospitalContractPickupAssembly : StoryAssembly\n    {\n        internal override StoryEdge Entry { get; }\n        internal HospitalContractPickupAssembly()\n        {\n            HospitalPickupSession session = new HospitalPickupSession();\n            HospitalPickupMenu menu = new HospitalPickupMenu();\n            StoryNode shortConfirmation = new StoryNode();\n            StoryNode zeroConfirmation = new StoryNode();\n            HospitalContractPickupGreetingEdge greeting = new HospitalContractPickupGreetingEdge(menu, session);\n            greeting.Connect(null, null);\n            AddOrdinaryOptions(menu.Ordinary, session, menu, shortConfirmation, zeroConfirmation);\n            AddOrdinaryOptions(menu.Task, session, menu, shortConfirmation, zeroConfirmation);\n            new HospitalSynaprestSubmitEdge(session, menu).Connect(menu.Task, null);\n            new HospitalContractPickupConfirmEdge(session).Connect(shortConfirmation, null);\n            new HospitalContractPickupRetryEdge(HospitalContractPickupTexts.RetryOption, menu).Connect(shortConfirmation, null);\n            new HospitalContractPickupConfirmEdge(session).Connect(zeroConfirmation, null);\n            new HospitalContractPickupRetryEdge(HospitalContractPickupTexts.ZeroRetryOption, menu).Connect(zeroConfirmation, null);\n            Entry = greeting;\n        }\n\n        private static void AddOrdinaryOptions(StoryNode node, HospitalPickupSession session,\n            HospitalPickupMenu menu, StoryNode shortConfirmation, StoryNode zeroConfirmation)\n        {\n            new HospitalContractPickupSubmitEdge(session, menu).Connect(node, null);\n            new HospitalContractPickupFinishEdge(session, shortConfirmation, zeroConfirmation).Connect(node, null);\n        }\n    }\n}\n","src/Story/Hospital/Events/HospitalContractPickup/HospitalContractPickupEdges.cs":"namespace FluxForge.Story.Hospital\n{\n    internal sealed class HospitalContractPickupGreetingEdge : StoryEdge\n    {\n        private readonly HospitalPickupMenu _menu;\n        private readonly HospitalPickupSession _session;\n        private readonly StoryNode _requestOptions;\n        private bool _offeringRequest;\n        internal HospitalContractPickupGreetingEdge(HospitalPickupMenu menu, HospitalPickupSession session)\n            : base(null, null)\n        {\n            _menu = menu;\n            _session = session;\n            _requestOptions = HospitalHighestDemandOfferAssembly.CreateOptions(menu.Ordinary);\n        }\n        internal override StoryNode ResolveNext()\n        {\n            return _offeringRequest ? _requestOptions : _menu.Current;\n        }\n        internal override void Execute(StorySequence player)\n        {\n            _session.BeginVisit();\n            _offeringRequest = HospitalHighestDemand.CanOffer;\n            if (_offeringRequest)\n            {\n                HospitalHighestDemandOfferEdge.Append(player);\n            }\n            else\n            {\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractPickupTexts.Greeting));\n            }\n            if (HospitalSynaprestState.Active)\n            {\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Ask1));\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Ask2));\n            }\n        }\n    }\n\n    internal sealed class HospitalContractPickupSubmitEdge : StoryEdge\n    {\n        private readonly HospitalPickupSession _session;\n        private readonly HospitalPickupMenu _menu;\n        internal HospitalContractPickupSubmitEdge(HospitalPickupSession session, HospitalPickupMenu menu)\n            : base(HospitalContractPickupTexts.ConfirmOption, \"question\") { _session = session; _menu = menu; }\n        internal override StoryNode ResolveNext() { return _menu.Current; }\n        internal override void Execute(StorySequence player)\n        {\n            HospitalContractInspection inspection = HospitalContractTrade.Inspect(HospitalContractDefinition.Chemicals);\n            if (inspection.HasUnderConcentration)\n            {\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractPickupTexts.UnderConcentration));\n            }\n            else if (inspection.Qualified.Count == 0)\n            {\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractPickupTexts.ZeroInspection));\n            }\n            else\n            {\n                _session.Submit(inspection);\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractPickupTexts.Continue));\n            }\n        }\n    }\n\n    internal sealed class HospitalContractPickupFinishEdge : StoryEdge\n    {\n        private readonly HospitalPickupSession _session;\n        private readonly StoryNode _shortConfirmation;\n        private readonly StoryNode _zeroConfirmation;\n        private StoryNode _next;\n        internal HospitalContractPickupFinishEdge(HospitalPickupSession session, StoryNode shortConfirmation, StoryNode zeroConfirmation)\n            : base(HospitalContractPickupTexts.FinishOption, \"question\")\n        { _session = session; _shortConfirmation = shortConfirmation; _zeroConfirmation = zeroConfirmation; }\n        internal override StoryNode ResolveNext() { return _next; }\n        internal override void Execute(StorySequence player)\n        {\n            _next = null;\n            if (_session.IsTrustedShortDelivery)\n            {\n                _session.Finish(player);\n            }\n            else if (_session.ItemCount == 0)\n            {\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractPickupTexts.ZeroInspection));\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractPickupTexts.ZeroQuestion));\n                _next = _zeroConfirmation;\n            }\n            else if (_session.Score < HospitalContractScore.Target)\n            {\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractPickupTexts.ShortQuestion));\n                _next = _shortConfirmation;\n            }\n            else\n            {\n                _session.Finish(player);\n            }\n        }\n    }\n\n    internal sealed class HospitalContractPickupConfirmEdge : StoryEdge\n    {\n        private readonly HospitalPickupSession _session;\n        internal HospitalContractPickupConfirmEdge(HospitalPickupSession session)\n            : base(HospitalContractPickupTexts.AcceptShortOption, \"question\") { _session = session; }\n        internal override void Execute(StorySequence player) { _session.Finish(player); }\n    }\n\n    internal sealed class HospitalContractPickupRetryEdge : StoryEdge\n    {\n        private readonly HospitalPickupMenu _menu;\n        internal HospitalContractPickupRetryEdge(string label, HospitalPickupMenu menu) : base(label, \"question\") { _menu = menu; }\n        internal override StoryNode ResolveNext() { return _menu.Current; }\n        internal override void Execute(StorySequence player) { }\n    }\n}\n","src/Story/Hospital/Events/HospitalContractPickup/HospitalContractPickupTexts.cs":"namespace FluxForge.Story.Hospital\n{\n    internal static class HospitalContractPickupTexts\n    {\n        internal const string FinishOption = \"story.HospitalContractPickupTexts.FinishOption\";\n        internal const string Continue = \"story.HospitalContractPickupTexts.Continue\";\n        internal const string Score = \"story.HospitalContractPickupTexts.Score\";\n        internal const string Total = \"story.HospitalContractPickupTexts.Total\";\n        internal const string Busy1 = \"story.HospitalContractPickupTexts.Busy1\";\n        internal const string Busy2 = \"story.HospitalContractPickupTexts.Busy2\";\n        internal const string Greeting\n            = \"story.HospitalContractPickupTexts.Greeting\";\n\n        internal const string ConfirmOption\n            = \"story.HospitalContractPickupTexts.ConfirmOption\";\n\n        internal const string UnderConcentration\n            = \"story.HospitalContractPickupTexts.UnderConcentration\";\n\n        internal const string ShortQuestion\n            = \"story.HospitalContractPickupTexts.ShortQuestion\";\n\n        internal const string ZeroInspection\n            = \"story.HospitalContractPickupTexts.ZeroInspection\";\n\n        internal const string ZeroQuestion\n            = \"story.HospitalContractPickupTexts.ZeroQuestion\";\n\n        internal const string ZeroRetryOption\n            = \"story.HospitalContractPickupTexts.ZeroRetryOption\";\n\n        internal const string ZeroSettled\n            = \"story.HospitalContractPickupTexts.ZeroSettled\";\n\n        internal const string AcceptShortOption\n            = \"story.HospitalContractPickupTexts.AcceptShortOption\";\n\n        internal const string RetryOption\n            = \"story.HospitalContractPickupTexts.RetryOption\";\n\n        internal const string ShortSettled\n            = \"story.HospitalContractPickupTexts.ShortSettled\";\n\n        internal const string OverThanks\n            = \"story.HospitalContractPickupTexts.OverThanks\";\n\n        internal const string Met1\n            = \"story.HospitalContractPickupTexts.Met1\";\n\n        internal const string Farewell\n            = \"story.HospitalContractPickupTexts.Farewell\";\n\n        internal const string Over3\n            = \"story.HospitalContractPickupTexts.Over3\";\n    }\n}\n","src/Story/Hospital/Events/HospitalContractPickup/Services/HospitalPickupMenu.cs":"namespace FluxForge.Story.Hospital\n{\n    /// <summary>任务完成后返回不含原液提交选项的普通菜单。<\/summary>\n    internal sealed class HospitalPickupMenu\n    {\n        internal StoryNode Ordinary { get; } = new StoryNode();\n        internal StoryNode Task { get; } = new StoryNode();\n        internal StoryNode Current\n        {\n            get { return HospitalSynaprestState.Active ? Task : Ordinary; }\n        }\n    }\n}\n","src/Story/Hospital/Events/HospitalContractPickup/Services/HospitalPickupSession.cs":"using System.Globalization;\n\nnamespace FluxForge.Story.Hospital\n{\n    /// <summary>本次到访的累计交货；只在内存中存在，结束时统一结算。<\/summary>\n    internal sealed class HospitalPickupSession\n    {\n        internal double Score { get; private set; }\n        internal int ItemCount { get; private set; }\n        internal int OrdinaryItemCount { get; private set; }\n        internal bool IsTrustedShortDelivery\n        {\n            get\n            {\n                return Score < HospitalContractScore.Target\n                    && HospitalReputation.Get() >= HospitalContractScore.ExternalExpertReputationThreshold;\n            }\n        }\n\n        internal void BeginVisit()\n        {\n            Score = 0d;\n            ItemCount = 0;\n            OrdinaryItemCount = 0;\n        }\n\n        internal void Submit(HospitalContractInspection inspection)\n        {\n            HospitalContractTrade.Take(inspection);\n            Add(inspection.Score, inspection.Qualified.Count);\n            OrdinaryItemCount += inspection.Qualified.Count;\n        }\n\n        internal void Add(double score, int count)\n        {\n            Score += score;\n            ItemCount += count;\n            ReputationUIManager.Instance.Notify(string.Format(\n                CultureInfo.InvariantCulture, ModHelper.GetLocalized(\"fluxforge\", HospitalContractPickupTexts.Score),\n                Score.ToString(\"0.###\", CultureInfo.InvariantCulture)));\n        }\n\n        internal void Finish(StorySequence player)\n        {\n            int payment = HospitalContractTrade.Settle(Score);\n            HospitalContractState.MarkPickup(StoreStation.GetDayCounter());\n            if (!HospitalHighestDemand.Completing)\n            {\n                player.SaySystem(string.Format(CultureInfo.InvariantCulture,\n                    ModHelper.GetLocalized(\"fluxforge\", HospitalContractPickupTexts.Total),\n                    Score.ToString(\"0.###\", CultureInfo.InvariantCulture), payment));\n                if (!IsTrustedShortDelivery && ItemCount == 0)\n                {\n                    player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractPickupTexts.ZeroSettled));\n                }\n                else if (!IsTrustedShortDelivery && OrdinaryItemCount > 0)\n                {\n                    if (Score >= HospitalContractScore.Target * 2d)\n                    {\n                        player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractPickupTexts.OverThanks));\n                        player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractPickupTexts.Over3));\n                    }\n                    else\n                    {\n                        player.SayNpc(Score >= HospitalContractScore.Target\n                            ? ModHelper.GetLocalized(\"fluxforge\", HospitalContractPickupTexts.Met1) : ModHelper.GetLocalized(\"fluxforge\", HospitalContractPickupTexts.ShortSettled));\n                    }\n                }\n            }\n            player.Insert(HospitalStoryPoints.PickupSettled);\n            if (IsTrustedShortDelivery)\n            {\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractPickupTexts.Busy1));\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractPickupTexts.Busy2));\n            }\n            else\n            {\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalContractPickupTexts.Farewell));\n            }\n        }\n    }\n}\n","src/Story/Hospital/Events/HospitalContractTermination/HospitalContractTerminationAssembly.cs":"namespace FluxForge.Story.Hospital\n{\n    internal sealed class HospitalContractTerminationAssembly : StoryAssembly\n    {\n        private readonly StoryEdge _entry;\n\n        internal HospitalContractTerminationAssembly()\n        {\n            HospitalContractTerminationEdge termination\n                = new HospitalContractTerminationEdge();\n            termination.Connect(null, null);\n            _entry = termination;\n        }\n\n        internal override StoryEdge Entry\n        {\n            get { return _entry; }\n        }\n    }\n}\n","src/Story/Hospital/Events/HospitalContractTermination/HospitalContractTerminationEdges.cs":"\nnamespace FluxForge.Story.Hospital\n{\n    internal sealed class HospitalContractTerminationEdge : StoryEdge\n    {\n        internal HospitalContractTerminationEdge()\n            : base(null, null)\n        {\n        }\n\n        internal override void Execute(StorySequence player)\n        {\n            HospitalContractState.Terminate();\n            player.SaySystem(ModHelper.GetLocalized(\"fluxforge\", HospitalContractTerminationTexts.Black));\n            player.SaySystem(ModHelper.GetLocalized(\"fluxforge\", HospitalContractTerminationTexts.Gray));\n        }\n    }\n}\n","src/Story/Hospital/Events/HospitalContractTermination/HospitalContractTerminationTexts.cs":"namespace FluxForge.Story.Hospital\n{\n    internal static class HospitalContractTerminationTexts\n    {\n        internal const string Black\n            = \"story.HospitalContractTerminationTexts.Black\";\n\n        internal const string Gray\n            = \"story.HospitalContractTerminationTexts.Gray\";\n    }\n}\n","src/Story/Hospital/Events/HospitalHighestDemand/Assemblies/HospitalHighestDemandAssemblies.cs":"namespace FluxForge.Story.Hospital\n{\n    internal sealed class HospitalHighestDemandOfferAssembly : StoryAssembly\n    {\n        private readonly StoryEdge _entry = new HospitalHighestDemandOfferEdge();\n\n        internal override StoryEdge Entry\n        {\n            get { return _entry; }\n        }\n\n        internal HospitalHighestDemandOfferAssembly()\n        {\n            _entry.Connect(null, CreateOptions(null));\n        }\n\n        internal static StoryNode CreateOptions(StoryNode returnTo)\n        {\n            StoryNode options = new StoryNode();\n            new HospitalHighestDemandDecisionEdge(true).Connect(options, returnTo);\n            new HospitalHighestDemandDecisionEdge(false).Connect(options, returnTo);\n            return options;\n        }\n    }\n\n    internal sealed class HospitalHighestDemandProgressAssembly : StoryAssembly\n    {\n        private readonly StoryEdge _entry = new HospitalHighestDemandProgressEdge();\n\n        internal override StoryEdge Entry\n        {\n            get { return _entry; }\n        }\n    }\n\n    internal sealed class HospitalHighestDemandCompleteAssembly : StoryAssembly\n    {\n        private readonly StoryEdge _entry = new HospitalHighestDemandCompleteEdge();\n\n        internal override StoryEdge Entry\n        {\n            get { return _entry; }\n        }\n\n        internal override void Complete()\n        {\n            HospitalHighestDemandState.Complete();\n        }\n    }\n}\n","src/Story/Hospital/Events/HospitalHighestDemand/Edges/HospitalHighestDemandEdges.cs":"using System.Globalization;\n\nnamespace FluxForge.Story.Hospital\n{\n    internal sealed class HospitalHighestDemandOfferEdge : StoryEdge\n    {\n        internal HospitalHighestDemandOfferEdge()\n            : base(null, null)\n        {\n        }\n\n        internal override void Execute(StorySequence player)\n        {\n            Append(player);\n        }\n\n        internal static void Append(StorySequence player)\n        {\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalHighestDemandTexts.Greeting));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalHighestDemandTexts.Offer1));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalHighestDemandTexts.Offer2));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalHighestDemandTexts.Offer3));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalHighestDemandTexts.Offer4));\n        }\n    }\n\n    internal sealed class HospitalHighestDemandDecisionEdge : StoryEdge\n    {\n        private readonly bool _accept;\n        internal HospitalHighestDemandDecisionEdge(bool accept)\n            : base(accept ? HospitalHighestDemandTexts.AcceptOption : HospitalHighestDemandTexts.DeclineOption, \"question\")\n        {\n            _accept = accept;\n        }\n        internal override void Execute(StorySequence player)\n        {\n            if (_accept)\n            {\n                HospitalHighestDemandState.Start();\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalHighestDemandTexts.AcceptResponse1));\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalHighestDemandTexts.AcceptResponse2));\n            }\n            else\n            {\n                HospitalHighestDemandState.Decline();\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalHighestDemandTexts.DeclineResponse));\n            }\n        }\n    }\n\n    internal sealed class HospitalHighestDemandProgressEdge : StoryEdge\n    {\n        internal HospitalHighestDemandProgressEdge()\n            : base(null, null)\n        {\n        }\n\n        internal override void Execute(StorySequence player)\n        {\n            player.SayNpc(string.Format(\n                CultureInfo.InvariantCulture,\n                ModHelper.GetLocalized(\"fluxforge\", HospitalHighestDemandTexts.Progress),\n                (HospitalHighestDemandState.Acid / 1000d).ToString(\"0.###\", CultureInfo.InvariantCulture),\n                (HospitalHighestDemandState.Base / 1000d).ToString(\"0.###\", CultureInfo.InvariantCulture),\n                (HospitalHighestDemandState.Alcohol / 1000d).ToString(\"0.###\", CultureInfo.InvariantCulture)));\n        }\n    }\n\n    internal sealed class HospitalHighestDemandCompleteEdge : StoryEdge\n    {\n        internal HospitalHighestDemandCompleteEdge()\n            : base(null, null)\n        {\n        }\n\n        internal override void Execute(StorySequence player)\n        {\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalHighestDemandTexts.Complete));\n        }\n    }\n}\n","src/Story/Hospital/Events/HospitalHighestDemand/HospitalHighestDemand.cs":"namespace FluxForge.Story.Hospital\n{\n    /// <summary>最高需求自行注册插入内容，正常送料/取货只声明业务插入点。<\/summary>\n    internal static class HospitalHighestDemand\n    {\n        internal static bool Completing\n        {\n            get { return HospitalHighestDemandState.Active && HospitalHighestDemandState.TargetMet; }\n        }\n\n        internal static bool CanOffer\n        {\n            get\n            {\n                return HospitalReputation.Get() >= HospitalContractScore.TrustReputationThreshold\n                    && !HospitalHighestDemandState.Started && !HospitalHighestDemandState.Declined;\n            }\n        }\n        internal static StoryEventDefinition[] CreateEvents(string npcId)\n        {\n            return new[]\n            {\n                new StoryEventDefinition(\n                    new StoryEvent(\n                        \"hospital.highest_demand.progress\",\n                        npcId,\n                        HospitalStoryPoints.PickupSettled,\n                        20,\n                        0,\n                        null,\n                        context => HospitalHighestDemandState.Active),\n                    new HospitalHighestDemandProgressAssembly(),\n                    StoryOutcome.Default),\n                new StoryEventDefinition(\n                    new StoryEvent(\n                        \"hospital.highest_demand.complete\",\n                        npcId,\n                        HospitalStoryPoints.PickupSettled,\n                        10,\n                        0,\n                        null,\n                        context => Completing),\n                    new HospitalHighestDemandCompleteAssembly(),\n                    StoryOutcome.Default),\n            };\n        }\n    }\n}\n","src/Story/Hospital/Events/HospitalHighestDemand/HospitalHighestDemandTexts.cs":"namespace FluxForge.Story.Hospital\n{\n    internal static class HospitalHighestDemandTexts\n    {\n        internal const string Greeting = \"story.HospitalHighestDemandTexts.Greeting\";\n        internal const string DeclineResponse = \"story.HospitalHighestDemandTexts.DeclineResponse\";\n        internal const string AcceptResponse1 = \"story.HospitalHighestDemandTexts.AcceptResponse1\";\n        internal const string AcceptResponse2 = \"story.HospitalHighestDemandTexts.AcceptResponse2\";\n        internal const string AcceptOption = \"story.HospitalHighestDemandTexts.AcceptOption\";\n        internal const string DeclineOption = \"story.HospitalHighestDemandTexts.DeclineOption\";\n        internal const string Offer1\n            = \"story.HospitalHighestDemandTexts.Offer1\";\n        internal const string Offer2\n            = \"story.HospitalHighestDemandTexts.Offer2\";\n        internal const string Offer3\n            = \"story.HospitalHighestDemandTexts.Offer3\";\n        internal const string Offer4\n            = \"story.HospitalHighestDemandTexts.Offer4\";\n        internal const string Progress\n            = \"story.HospitalHighestDemandTexts.Progress\";\n        internal const string Complete\n            = \"story.HospitalHighestDemandTexts.Complete\";\n    }\n}\n","src/Story/Hospital/Events/HospitalSynaprest/Edges/HospitalSynaprestOfferEdges.cs":"namespace FluxForge.Story.Hospital\n{\n    internal sealed class HospitalSynaprestGreetingEdge : StoryEdge\n    {\n        internal HospitalSynaprestGreetingEdge() : base(null, null) { }\n        internal override void Execute(StorySequence player)\n        {\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Greeting1));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Greeting2));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Greeting3));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Greeting4));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Greeting5));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Greeting6));\n        }\n    }\n\n    internal sealed class HospitalSynaprestAcceptEdge : StoryEdge\n    {\n        internal HospitalSynaprestAcceptEdge() : base(HospitalSynaprestTexts.AcceptOption, \"question\") { }\n        internal override void Execute(StorySequence player)\n        {\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Accept1));\n            player.Do(delegate\n            {\n                HospitalSynaprestStock.GiveInitial();\n                HospitalSynaprestState.Start();\n            });\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Accept2));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Accept3));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Accept4));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Accept5));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Accept6));\n        }\n    }\n\n    internal sealed class HospitalSynaprestDeclineEdge : StoryEdge\n    {\n        internal HospitalSynaprestDeclineEdge() : base(HospitalSynaprestTexts.DeclineOption, \"question\") { }\n        internal override void Execute(StorySequence player)\n        {\n            HospitalSynaprestState.Close();\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Decline));\n        }\n    }\n}\n","src/Story/Hospital/Events/HospitalSynaprest/Edges/HospitalSynaprestPickupEdges.cs":"using System.Globalization;\n\nnamespace FluxForge.Story.Hospital\n{\n    internal sealed class HospitalSynaprestSubmitEdge : StoryEdge\n    {\n        private readonly HospitalPickupSession _session;\n        private readonly HospitalPickupMenu _menu;\n        internal HospitalSynaprestSubmitEdge(HospitalPickupSession session, HospitalPickupMenu menu)\n            : base(HospitalSynaprestTexts.SubmitOption, \"question\") { _session = session; _menu = menu; }\n        internal override StoryNode ResolveNext() { return _menu.Current; }\n        internal override void Execute(StorySequence player)\n        {\n            bool first = HospitalSynaprestState.Volume == 0d;\n            bool sawSynaprest;\n            double volume = HospitalSynaprestTrade.Submit(_session, out sawSynaprest);\n            if (volume == 0d)\n            {\n                player.SayNpc(EmporiumEntry.Instance.backInvinvElement.childItems.Count == 0\n                    ? ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Empty)\n                    : sawSynaprest ? ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Impure) : ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Missing));\n                return;\n            }\n\n            HospitalSynaprestState.Record(volume);\n            if (first)\n            {\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.First1));\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.First2));\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.First3));\n            }\n            if (first && HospitalSynaprestState.Completed)\n            {\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.AllAtOnce));\n            }\n            else\n            {\n                player.SayNpc(string.Format(CultureInfo.InvariantCulture,\n                    first ? ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.FirstProgress) : ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Progress),\n                    (HospitalSynaprestState.Volume / 1000d).ToString(\"0.###\", CultureInfo.InvariantCulture)));\n            }\n            if (HospitalSynaprestState.Completed)\n            {\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Complete1));\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Complete2));\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.Complete3));\n            }\n            player.SayNpc(HospitalSynaprestState.Completed\n                ? ModHelper.GetLocalized(\"fluxforge\", HospitalSynaprestTexts.CompleteContinue) : ModHelper.GetLocalized(\"fluxforge\", HospitalContractPickupTexts.Continue));\n        }\n    }\n\n}\n","src/Story/Hospital/Events/HospitalSynaprest/HospitalSynaprestOfferAssembly.cs":"namespace FluxForge.Story.Hospital\n{\n    internal sealed class HospitalSynaprestOfferAssembly : StoryAssembly\n    {\n        internal override StoryEdge Entry { get; }\n\n        internal HospitalSynaprestOfferAssembly()\n        {\n            StoryNode options = new StoryNode();\n            HospitalSynaprestGreetingEdge greeting = new HospitalSynaprestGreetingEdge();\n            greeting.Connect(null, options);\n            new HospitalSynaprestAcceptEdge().Connect(options, null);\n            new HospitalSynaprestDeclineEdge().Connect(options, null);\n            Entry = greeting;\n        }\n    }\n}\n","src/Story/Hospital/Events/HospitalSynaprest/HospitalSynaprestTexts.cs":"namespace FluxForge.Story.Hospital\n{\n    internal static class HospitalSynaprestTexts\n    {\n        internal const string Greeting1 = \"story.HospitalSynaprestTexts.Greeting1\";\n        internal const string Greeting2 = \"story.HospitalSynaprestTexts.Greeting2\";\n        internal const string Greeting3 = \"story.HospitalSynaprestTexts.Greeting3\";\n        internal const string Greeting4 = \"story.HospitalSynaprestTexts.Greeting4\";\n        internal const string Greeting5 = \"story.HospitalSynaprestTexts.Greeting5\";\n        internal const string Greeting6 = \"story.HospitalSynaprestTexts.Greeting6\";\n        internal const string AcceptOption = \"story.HospitalSynaprestTexts.AcceptOption\";\n        internal const string DeclineOption = \"story.HospitalSynaprestTexts.DeclineOption\";\n        internal const string Decline = \"story.HospitalSynaprestTexts.Decline\";\n        internal const string Accept1 = \"story.HospitalSynaprestTexts.Accept1\";\n        internal const string Accept2 = \"story.HospitalSynaprestTexts.Accept2\";\n        internal const string Accept3 = \"story.HospitalSynaprestTexts.Accept3\";\n        internal const string Accept4 = \"story.HospitalSynaprestTexts.Accept4\";\n        internal const string Accept5 = \"story.HospitalSynaprestTexts.Accept5\";\n        internal const string Accept6 = \"story.HospitalSynaprestTexts.Accept6\";\n        internal const string Ask1 = \"story.HospitalSynaprestTexts.Ask1\";\n        internal const string Ask2 = \"story.HospitalSynaprestTexts.Ask2\";\n        internal const string SubmitOption = \"story.HospitalSynaprestTexts.SubmitOption\";\n        internal const string Empty = \"story.HospitalSynaprestTexts.Empty\";\n        internal const string Missing = \"story.HospitalSynaprestTexts.Missing\";\n        internal const string Impure = \"story.HospitalSynaprestTexts.Impure\";\n        internal const string First1 = \"story.HospitalSynaprestTexts.First1\";\n        internal const string First2 = \"story.HospitalSynaprestTexts.First2\";\n        internal const string First3 = \"story.HospitalSynaprestTexts.First3\";\n        internal const string AllAtOnce = \"story.HospitalSynaprestTexts.AllAtOnce\";\n        internal const string FirstProgress = \"story.HospitalSynaprestTexts.FirstProgress\";\n        internal const string Progress = \"story.HospitalSynaprestTexts.Progress\";\n        internal const string Complete1 = \"story.HospitalSynaprestTexts.Complete1\";\n        internal const string Complete2 = \"story.HospitalSynaprestTexts.Complete2\";\n        internal const string Complete3 = \"story.HospitalSynaprestTexts.Complete3\";\n        internal const string CompleteContinue = \"story.HospitalSynaprestTexts.CompleteContinue\";\n    }\n}\n","src/Story/Hospital/Events/HospitalSynaprest/Services/HospitalSynaprestState.cs":"using System.Globalization;\n\nnamespace FluxForge.Story.Hospital\n{\n    /// <summary>跨次到访的提纯任务进度；本次交货结算不在此保存。<\/summary>\n    internal static class HospitalSynaprestState\n    {\n        private const string StartedKey = \"hospital.synaprest.started\";\n        private const string ClosedKey = \"hospital.synaprest.closed\";\n        private const string CompletedKey = \"hospital.synaprest.completed\";\n        private const string VolumeKey = \"hospital.synaprest.volume\";\n        internal const double Target = 550000d;\n\n        internal static bool Started { get { return PlayerStore.Instance.modData.ContainsKey(StartedKey); } }\n        internal static bool Closed { get { return PlayerStore.Instance.modData.ContainsKey(ClosedKey); } }\n        internal static bool Completed { get { return PlayerStore.Instance.modData.ContainsKey(CompletedKey); } }\n        internal static bool Active { get { return Started && !Closed && !Completed; } }\n        internal static double Volume\n        {\n            get\n            {\n                string value;\n                return PlayerStore.Instance.modData.TryGetValue(VolumeKey, out value)\n                    ? double.Parse(value, CultureInfo.InvariantCulture) : 0d;\n            }\n        }\n\n        internal static bool CanOffer(int day)\n        {\n            return HospitalContractState.Started && !HospitalContractState.Terminated\n                && HospitalHighestDemandState.Completed && HospitalReputation.Get() >= 100\n                && !Started && !Closed\n                && !HospitalContractState.IsMaterialDue(day)\n                && !HospitalContractState.IsPickupDue(day);\n        }\n\n        internal static void Start() { PlayerStore.Instance.modData[StartedKey] = \"1\"; }\n        internal static void Close() { PlayerStore.Instance.modData[ClosedKey] = \"1\"; }\n        internal static void Record(double volume)\n        {\n            double total = Volume + volume;\n            PlayerStore.Instance.modData[VolumeKey] = total.ToString(\"R\", CultureInfo.InvariantCulture);\n            if (total >= Target)\n            {\n                PlayerStore.Instance.modData[CompletedKey] = \"1\";\n            }\n        }\n    }\n}\n","src/Story/Hospital/Events/HospitalSynaprest/Services/HospitalSynaprestStock.cs":"using FluxForge.Mod;\n\nnamespace FluxForge.Story.Hospital\n{\n    internal static class HospitalSynaprestStock\n    {\n        internal static void GiveInitial()\n        {\n            Give(\"bottled_water\", 600000, 6061);\n        }\n\n        internal static void GiveWeekly()\n        {\n            // 400000 / (400000 + 21052) > 95%，两端都保留污染。\n            Give(\"small_bottled_water\", 400000, RNG.GetRandomInt(2, 21052));\n        }\n\n        private static void Give(string bottle, int synaprest, int pollution)\n        {\n            GameItem item = DirectoryMaster.Item(bottle);\n            FlowProperties contents = new FlowProperties();\n            contents.Set(FlowProps.Synaprest, synaprest);\n            int starch = RNG.GetRandomInt(1, pollution - 1);\n            contents.Set(FlowProps.Starch, starch);\n            contents.Set(RNG.Roll(50) ? FlowProps.Acid : FlowProps.Base, pollution - starch);\n            contents.Set(FlowProps.Temperature, 20d);\n            FlowStock.Write(item, contents);\n            item.name = ModHelper.GetLocalized(\"fluxforge\", \"item.stock.synaprest.name\");\n            GeneralHelper.SetItemOwned(item, true);\n            GraphUtils.EmporiumTryAdd(EmporiumEntry.Instance.frontInvinvElement, item);\n        }\n    }\n}\n","src/Story/Hospital/Events/HospitalSynaprest/Services/HospitalSynaprestTrade.cs":"using System.Collections.Generic;\nusing FluxForge.Mod;\n\nnamespace FluxForge.Story.Hospital\n{\n    internal static class HospitalSynaprestTrade\n    {\n        // 此任务与原最高需求一样只接受单一成分纯液，不以显示四舍五入后的100%判断。\n        internal static double Submit(HospitalPickupSession session, out bool sawSynaprest)\n        {\n            List<GameItem> accepted = new List<GameItem>();\n            double volume = 0d;\n            sawSynaprest = false;\n            GameInventory counter = EmporiumEntry.Instance.backInvinvElement;\n            for (int i = 0; i < counter.childItems.Count; i++)\n            {\n                GameItem item = counter.childItems[i];\n                if (!item.IsTag(FlowTags.LiquidContainerTag) || item.IsTag(FlowTags.FlowDevice))\n                {\n                    continue;\n                }\n                FlowProperties contents = FlowStock.Read(item);\n                double active = contents.Get(FlowProps.Synaprest);\n                if (active <= 0d)\n                {\n                    continue;\n                }\n                sawSynaprest = true;\n                if (active == contents.SubstanceTotal)\n                {\n                    accepted.Add(item);\n                    volume += active;\n                }\n            }\n            if (accepted.Count > 0)\n            {\n                for (int i = 0; i < accepted.Count; i++)\n                {\n                    accepted[i].Destroy();\n                }\n                session.Add(volume / 1000d * 5d, accepted.Count);\n            }\n            return volume;\n        }\n    }\n}\n","src/Story/Hospital/HospitalContractDefinition.cs":"using System.Collections.Generic;\n\nnamespace FluxForge.Story.Hospital\n{\n    /// <summary>医院常规收货的品类、最低浓度和基础分配置；专项任务与文案另行维护。<\/summary>\n    internal static class HospitalContractDefinition\n    {\n        private static readonly ChemicalRequest[] Requests =\n        {\n            new ChemicalRequest(FlowProps.Acid),\n            new ChemicalRequest(FlowProps.Base),\n            new ChemicalRequest(FlowProps.Alcohol, 0.90d, 0.8d),\n        };\n\n        private static readonly ChemicalRequest[] CompletedRequests =\n        {\n            Requests[0], Requests[1], Requests[2],\n            // 纯液权重为3；基础分5/3使最终得分恰为每mL 5分。\n            new ChemicalRequest(FlowProps.Synaprest, 1d, 5d / 3d),\n        };\n\n        internal static IReadOnlyList<ChemicalRequest> Chemicals\n        {\n            get { return HospitalSynaprestState.Completed ? CompletedRequests : Requests; }\n        }\n    }\n}\n","src/Story/Hospital/HospitalContractInspection.cs":"using System.Collections.Generic;\n\nnamespace FluxForge.Story.Hospital\n{\n    /// <summary>当前选项的桌面检查结果：合格容器、得分、低浓度标记及三种纯试剂体积（微升）。<\/summary>\n    internal sealed class HospitalContractInspection\n    {\n        internal IReadOnlyList<GameItem> Qualified { get; }\n        internal double Score { get; }\n        internal bool HasUnderConcentration { get; }\n        internal double PureAcidMicrolitres { get; }\n        internal double PureBaseMicrolitres { get; }\n        internal double PureAlcoholMicrolitres { get; }\n\n        internal HospitalContractInspection(\n            IReadOnlyList<GameItem> qualified,\n            double score,\n            bool hasUnderConcentration,\n            double pureAcidMicrolitres,\n            double pureBaseMicrolitres,\n            double pureAlcoholMicrolitres)\n        {\n            Qualified = qualified;\n            Score = score;\n            HasUnderConcentration = hasUnderConcentration;\n            PureAcidMicrolitres = pureAcidMicrolitres;\n            PureBaseMicrolitres = pureBaseMicrolitres;\n            PureAlcoholMicrolitres = pureAlcoholMicrolitres;\n        }\n    }\n}\n","src/Story/Hospital/HospitalContractSchedule.cs":"namespace FluxForge.Story.Hospital\n{\n    /// <summary>以首次约定日期的星期为锚点，不在其他星期补发跳过的业务。<\/summary>\n    internal static class HospitalContractSchedule\n    {\n        internal static bool IsDue(int nextDay, int today)\n        {\n            return today >= nextDay && (today - nextDay) % 7 == 0;\n        }\n\n        internal static int Advance(int nextDay, int today)\n        {\n            if (nextDay > today)\n            {\n                return nextDay;\n            }\n\n            int periods = (today - nextDay) / 7 + 1;\n            return nextDay + periods * 7;\n        }\n\n    }\n}\n","src/Story/Hospital/HospitalContractScore.cs":"using System;\n\nnamespace FluxForge.Story.Hospital\n{\n    /// <summary>医院合同的纯计分规则，不依赖 Unity 或存档。<\/summary>\n    internal static class HospitalContractScore\n    {\n        internal const double MinimumConcentration = 0.90d;\n        internal const double PurityThreshold = 0.99d;\n        internal const int Target = 300;\n        internal const int MaxPositivePerContract = 20;\n        internal const double PaymentRate = 0.1d;\n        internal const int TrustReputationThreshold = 60;\n        internal const int ExternalExpertReputationThreshold = 100;\n        private const double TrustPaymentMultiplier = 1.2d;\n\n        private const double Epsilon = 1e-9d;\n\n        internal static double Weight(double concentration)\n        {\n            if (concentration + Epsilon < PurityThreshold)\n            {\n                return 1d;\n            }\n\n            if (concentration + Epsilon >= 1d)\n            {\n                return 3d;\n            }\n\n            return 1d + (concentration - PurityThreshold) * 100d;\n        }\n\n        internal static int ReputationDelta(double score)\n        {\n            if (score >= Target)\n            {\n                return Math.Min(\n                    (int)Math.Floor(score / 100d),\n                    MaxPositivePerContract);\n            }\n\n            return -(int)Math.Ceiling((Target - score) / 100d);\n        }\n\n        internal static int ReputationDelta(double score, int reputation)\n        {\n            return reputation >= ExternalExpertReputationThreshold && score < Target\n                ? 0 : ReputationDelta(score);\n        }\n\n        internal static double Score(\n            double millilitres,\n            double baseScore,\n            double concentration)\n        {\n            return millilitres * baseScore * Weight(concentration);\n        }\n\n        internal static int Payment(double score)\n        {\n            return (int)Math.Floor(score * PaymentRate);\n        }\n\n        internal static int Payment(double score, int reputation)\n        {\n            int payment = Payment(score);\n            return reputation >= TrustReputationThreshold\n                ? (int)Math.Floor(payment * TrustPaymentMultiplier)\n                : payment;\n        }\n    }\n}\n","src/Story/Hospital/HospitalContractState.cs":"using FluxForge.Mod;\n\nnamespace FluxForge.Story.Hospital\n{\n    /// <summary>医院合同状态；只存 modData，不新增存档类。<\/summary>\n    internal static class HospitalContractState\n    {\n        private const string StartedKey\n            = \"hospital.contract.started\";\n        private const string StartDayKey\n            = \"hospital.contract.start_day\";\n        private const string LastPickupDayKey\n            = \"hospital.contract.last_pickup_day\";\n        private const string LastMaterialDayKey\n            = \"hospital.contract.last_material_day\";\n        private const string OfferReadyKey\n            = \"hospital.contract.offer_ready\";\n        private const string OfferDeclinedKey\n            = \"hospital.contract.offer_declined\";\n        private const string DetailsExplainedKey\n            = \"hospital.contract.details_explained\";\n        private const string TerminatedKey\n            = \"hospital.contract.terminated\";\n\n        internal static bool Started\n        {\n            get\n            {\n                return PlayerStore.Instance.modData.ContainsKey(StartedKey);\n            }\n        }\n\n        internal static int StartDay\n        {\n            get { return ReadInt(StartDayKey); }\n        }\n\n        internal static int NextPickupDay\n        {\n            get { return HospitalContractSchedule.Advance(StartDay + 7, LastPickupDay); }\n        }\n\n        internal static int NextMaterialDay\n        {\n            get { return HospitalContractSchedule.Advance(StartDay + 3, LastMaterialDay); }\n        }\n\n        internal static int LastPickupDay\n        {\n            get { return ReadInt(LastPickupDayKey); }\n        }\n\n        internal static int LastMaterialDay\n        {\n            get { return ReadInt(LastMaterialDayKey); }\n        }\n\n        internal static bool OfferReady\n        {\n            get\n            {\n                return PlayerStore.Instance.modData.ContainsKey(\n                    OfferReadyKey);\n            }\n        }\n\n        internal static bool OfferDeclined\n        {\n            get\n            {\n                return PlayerStore.Instance.modData.ContainsKey(\n                    OfferDeclinedKey);\n            }\n        }\n\n        internal static bool DetailsExplained\n        {\n            get\n            {\n                return PlayerStore.Instance.modData.ContainsKey(DetailsExplainedKey);\n            }\n        }\n\n        internal static void MarkDetailsExplained()\n        {\n            PlayerStore.Instance.modData[DetailsExplainedKey] = \"1\";\n        }\n\n        internal static bool Terminated\n        {\n            get\n            {\n                return PlayerStore.Instance.modData.ContainsKey(\n                    TerminatedKey);\n            }\n        }\n\n        internal static void Start(int day)\n        {\n            if (Started)\n            {\n                return;\n            }\n\n            PlayerStore.Instance.modData[StartedKey] = \"1\";\n            PlayerStore.Instance.modData[StartDayKey] = day.ToString();\n            PlayerStore.Instance.modData[LastPickupDayKey]\n                = day.ToString();\n            PlayerStore.Instance.modData[LastMaterialDayKey]\n                = day.ToString();\n            PlayerStore.Instance.modData.Remove(OfferReadyKey);\n        }\n\n        internal static bool IsPickupDue(int day)\n        {\n            return Started\n                && HospitalContractSchedule.IsDue(\n                    StartDay + 7,\n                    day)\n                && day > LastPickupDay;\n        }\n\n        internal static bool IsMaterialDue(int day)\n        {\n            return Started\n                && HospitalContractSchedule.IsDue(\n                    StartDay + 3,\n                    day)\n                && day > LastMaterialDay;\n        }\n\n        internal static bool ShouldRunPickup(int day)\n        {\n            return !Terminated && IsPickupDue(day);\n        }\n\n        internal static bool ShouldRunMaterial(int day)\n        {\n            return !Terminated && IsMaterialDue(day);\n        }\n\n        internal static void MarkPickup(int day)\n        {\n            PlayerStore.Instance.modData[LastPickupDayKey] = day.ToString();\n        }\n\n        internal static void MarkMaterial(int day)\n        {\n            PlayerStore.Instance.modData[LastMaterialDayKey] = day.ToString();\n        }\n\n        internal static void QueueOffer()\n        {\n            PlayerStore.Instance.modData[OfferReadyKey] = \"1\";\n        }\n\n        internal static void DeclineOffer()\n        {\n            PlayerStore.Instance.modData.Remove(OfferReadyKey);\n            PlayerStore.Instance.modData[OfferDeclinedKey] = \"1\";\n        }\n\n        internal static void Terminate()\n        {\n            PlayerStore.Instance.modData[TerminatedKey] = \"1\";\n        }\n\n        private static int ReadInt(string key)\n        {\n            string raw;\n            if (!PlayerStore.Instance.modData.TryGetValue(key, out raw))\n            {\n                return 0;\n            }\n\n            return int.Parse(raw);\n        }\n    }\n}\n","src/Story/Hospital/HospitalContractStock.cs":"using FluxForge.Mod;\n\nnamespace FluxForge.Story.Hospital\n{\n    /// <summary>\n    /// 医院每周送来的受污染原料。\n    /// 与首次到访赠送的酸/碱分开；调用方在发放时按当前医院声望计算瓶数。\n    /// <\/summary>\n    internal static class HospitalContractStock\n    {\n        private const int BottleCapacity = 250000;\n        private const int PollutionMin = 150000;\n        private const int PollutionMax = 190000;\n\n        internal static int WeeklyCount()\n        {\n            int count = 2;\n            int reputation = HospitalReputation.Get();\n            if (reputation >= 20)\n            {\n                count++;\n            }\n\n            if (reputation >= 40)\n            {\n                count++;\n            }\n\n            return count;\n        }\n\n        internal static void GiveWeekly(int count)\n        {\n            for (int i = 0; i < count; i++)\n            {\n                GiveBottle(i % 2 == 0);\n            }\n        }\n\n        private static void GiveBottle(bool acid)\n        {\n            GameItem item = PreBuiltItemHelper.CreateChemicalBottle(\n                acid ? \"acid\" : \"base\");\n\n            int pollution = RNG.GetRandomInt(PollutionMin, PollutionMax);\n            int chemical = Share(pollution, 0.12f, 0.20f);\n            int heavyMetal = Share(pollution, 0.08f, 0.15f);\n            int microplastic = Share(pollution, 0.06f, 0.12f);\n            int physical = Share(pollution, 0.06f, 0.12f);\n            int mineral = Share(pollution, 0.04f, 0.08f);\n            int debris = Share(pollution, 0.04f, 0.08f);\n\n            int active = BottleCapacity\n                - chemical\n                - heavyMetal\n                - microplastic\n                - physical\n                - mineral\n                - debris;\n\n            FlowProperties properties = new FlowProperties();\n            properties.Set(\n                acid ? FlowProps.Acid : FlowProps.Base,\n                active);\n            properties.Set(FlowProps.ChemicalContaminant, chemical);\n            properties.Set(FlowProps.HeavyMetal, heavyMetal);\n            properties.Set(FlowProps.Microplastic, microplastic);\n            properties.Set(FlowProps.PhysicalContaminant, physical);\n            properties.Set(FlowProps.Mineral, mineral);\n            properties.Set(FlowProps.Debris, debris);\n            properties.Set(FlowProps.Temperature, 20d);\n            FlowStock.Write(item, properties);\n\n            item.name = ModHelper.GetLocalized(\"fluxforge\", acid ? \"item.stock.hospital_acid.name\" : \"item.stock.hospital_base.name\");\n            GeneralHelper.SetItemOwned(item, true);\n            GraphUtils.EmporiumTryAdd(\n                EmporiumEntry.Instance.frontInvinvElement,\n                item);\n        }\n\n        private static int Share(int total, float min, float max)\n        {\n            return RNG.GetRandomInt(\n                (int)(total * min),\n                (int)(total * max));\n        }\n    }\n}\n","src/Story/Hospital/HospitalContractTrade.cs":"using System.Collections.Generic;\nusing FluxForge.Mod;\n\nnamespace FluxForge.Story.Hospital\n{\n    /// <summary>\n    /// 医院取货：分别执行后柜台检查与已确认货物结算，按配置品类和浓度计分。\n    /// 提交时收走合格容器并累计纯试剂任务进度；结束来访时统一付款、调整声望。\n    /// <\/summary>\n    internal static class HospitalContractTrade\n    {\n        private const double Epsilon = 1e-9d;\n\n        /// <summary>只读取桌面，供当前选项判断；不产生交易副作用。<\/summary>\n        internal static HospitalContractInspection Inspect(\n            IReadOnlyList<ChemicalRequest> requests)\n        {\n            bool hasUnderConcentration = false;\n            GameInventory counter\n                = EmporiumEntry.Instance.backInvinvElement;\n            List<GameItem> qualified = new List<GameItem>();\n            double score = 0d;\n            double pureAcid = 0d;\n            double pureBase = 0d;\n            double pureAlcohol = 0d;\n\n            for (int i = 0; i < counter.childItems.Count; i++)\n            {\n                GameItem item = counter.childItems[i];\n                if (!item.IsTag(FlowTags.LiquidContainerTag)\n                    || item.IsTag(FlowTags.FlowDevice))\n                {\n                    continue;\n                }\n\n                FlowProperties properties = FlowStock.Read(item);\n                if (!HospitalSynaprestState.Completed\n                    && properties.Get(FlowProps.Synaprest) > 0d)\n                {\n                    continue;\n                }\n                double total = properties.SubstanceTotal;\n                if (total <= 0d)\n                {\n                    continue;\n                }\n\n                double bestScorePerMillilitre = 0d;\n                bool accepted = false;\n                bool sawRequestedChemical = false;\n                for (int j = 0; j < requests.Count; j++)\n                {\n                    ChemicalRequest request = requests[j];\n                    double active = properties.Get(request.Key);\n                    if (active <= 0d)\n                    {\n                        continue;\n                    }\n\n                    sawRequestedChemical = true;\n                    double concentration = active / total;\n                    if (concentration + Epsilon\n                        < request.MinimumConcentration)\n                    {\n                        continue;\n                    }\n\n                    double scorePerMillilitre\n                        = HospitalContractScore.Score(\n                            1d,\n                            request.BaseScore,\n                            concentration);\n                    if (scorePerMillilitre > bestScorePerMillilitre)\n                    {\n                        bestScorePerMillilitre = scorePerMillilitre;\n                    }\n\n                    accepted = true;\n                    if (active == total)\n                    {\n                        if (request.Key.Equals(FlowProps.Acid))\n                        {\n                            pureAcid += total;\n                        }\n                        else if (request.Key.Equals(FlowProps.Base))\n                        {\n                            pureBase += total;\n                        }\n                        else if (request.Key.Equals(FlowProps.Alcohol))\n                        {\n                            pureAlcohol += total;\n                        }\n                    }\n                }\n\n                if (!accepted)\n                {\n                    hasUnderConcentration |= sawRequestedChemical;\n                    continue;\n                }\n\n                qualified.Add(item);\n                score += total / 1000d * bestScorePerMillilitre;\n            }\n\n            return new HospitalContractInspection(\n                qualified, score, hasUnderConcentration,\n                pureAcid, pureBase, pureAlcohol);\n        }\n\n        /// <summary>收走本次提交刚检查过的货物；此处不支付货款、不推进周日期。<\/summary>\n        internal static void Take(\n            HospitalContractInspection inspection)\n        {\n            for (int i = 0; i < inspection.Qualified.Count; i++)\n            {\n                inspection.Qualified[i].Destroy();\n            }\n\n            if (HospitalHighestDemandState.Active)\n            {\n                HospitalHighestDemandState.Record(inspection);\n            }\n\n        }\n\n        internal static int Settle(double score)\n        {\n            int payment = HospitalContractScore.Payment(score, HospitalReputation.Get());\n            PlayerStore.Instance.ModCash(payment);\n            int delta = HospitalContractScore.ReputationDelta(score, HospitalReputation.Get());\n            HospitalReputation.Add(delta);\n\n            return payment;\n        }\n    }\n}\n","src/Story/Hospital/HospitalHighestDemandState.cs":"using System.Globalization;\n\nnamespace FluxForge.Story.Hospital\n{\n    /// <summary>最高需求：玩家接受后累计已提交的三种100%纯试剂；拒绝后不再提议。<\/summary>\n    internal static class HospitalHighestDemandState\n    {\n        private const string StartedKey = \"hospital.highest_demand.started\";\n        private const string CompletedKey = \"hospital.highest_demand.completed\";\n        private const string AcidKey = \"hospital.highest_demand.acid\";\n        private const string BaseKey = \"hospital.highest_demand.base\";\n        private const string AlcoholKey = \"hospital.highest_demand.alcohol\";\n        private const double TargetMicrolitres = 1000000d;\n\n        internal static bool Started\n        {\n            get { return PlayerStore.Instance.modData.ContainsKey(StartedKey); }\n        }\n\n        internal static bool Declined\n        {\n            get { return PlayerStore.Instance.modData.ContainsKey(\"hospital.highest_demand.declined\"); }\n        }\n\n        internal static void Decline()\n        {\n            PlayerStore.Instance.modData[\"hospital.highest_demand.declined\"] = \"1\";\n        }\n\n        internal static bool Completed\n        {\n            get { return PlayerStore.Instance.modData.ContainsKey(CompletedKey); }\n        }\n\n        internal static bool Active\n        {\n            get { return Started && !Completed; }\n        }\n\n        internal static double Acid { get { return Read(AcidKey); } }\n        internal static double Base { get { return Read(BaseKey); } }\n        internal static double Alcohol { get { return Read(AlcoholKey); } }\n\n        internal static bool TargetMet\n        {\n            get\n            {\n                return Acid >= TargetMicrolitres\n                    && Base >= TargetMicrolitres\n                    && Alcohol >= TargetMicrolitres;\n            }\n        }\n\n        internal static void Start()\n        {\n            PlayerStore.Instance.modData[StartedKey] = \"1\";\n        }\n\n        internal static void Record(HospitalContractInspection inspection)\n        {\n            Write(AcidKey, Acid + inspection.PureAcidMicrolitres);\n            Write(BaseKey, Base + inspection.PureBaseMicrolitres);\n            Write(AlcoholKey, Alcohol + inspection.PureAlcoholMicrolitres);\n        }\n\n        internal static void Complete()\n        {\n            PlayerStore.Inst
