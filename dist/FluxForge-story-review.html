ance.modData[CompletedKey] = \"1\";\n        }\n\n        private static double Read(string key)\n        {\n            string value;\n            return PlayerStore.Instance.modData.TryGetValue(key, out value)\n                ? double.Parse(value, CultureInfo.InvariantCulture) : 0d;\n        }\n\n        private static void Write(string key, double value)\n        {\n            PlayerStore.Instance.modData[key]\n                = value.ToString(\"R\", CultureInfo.InvariantCulture);\n        }\n    }\n}\n","src/Story/Hospital/HospitalReputation.cs":"using FluxForge.Mod;\n\nnamespace FluxForge.Story.Hospital\n{\n    /// <summary>医院声望：只在合同签订后注册，复用原版 StoreReputation。<\/summary>\n    internal static class HospitalReputation\n    {\n        internal const string FactionId = \"FACTION_FLUXFORGE_HOSPITAL\";\n        internal static string DisplayName\n        {\n            get { return ModHelper.GetLocalized(\"fluxforge\", \"faction.hospital.name\"); }\n        }\n\n        internal static bool IsRegistered\n        {\n            get\n            {\n                return StoreReputation.GetStoreReputation(FactionId) != null;\n            }\n        }\n\n        internal static void EnsureFaction()\n        {\n            StoreReputation reputation\n                = StoreReputation.GetStoreReputation(FactionId);\n\n            if (reputation == null)\n            {\n                reputation = new StoreReputation\n                {\n                    factionId = FactionId,\n                    factionDisplay = DisplayName,\n                    factionColor1 = \"42a2aa\",\n                    factionColor2 = \"743d70\",\n                    factionColor3 = \"ac7b9a\",\n                };\n                PlayerStore.Instance.storeReputations.Add(reputation);\n            }\n\n            reputation.factionDisplay = DisplayName;\n            HospitalReputationTexts.Register();\n\n            EnsurePerk(\n                reputation,\n                HospitalReputationTexts.TrustedPerkId,\n                20,\n                1);\n            EnsurePerk(\n                reputation,\n                HospitalReputationTexts.AcePerkId,\n                40,\n                1);\n            EnsurePerk(\n                reputation,\n                HospitalReputationTexts.TrustPaymentPerkId,\n                HospitalContractScore.TrustReputationThreshold,\n                1);\n            EnsurePerk(\n                reputation,\n                HospitalReputationTexts.SpecialProcurementPerkId,\n                80,\n                1);\n            EnsurePerk(\n                reputation,\n                HospitalReputationTexts.TerminationPerkId,\n                -20,\n                -1);\n\n            EnsurePerk(\n                reputation,\n                HospitalReputationTexts.ExternalExpertPerkId,\n                HospitalContractScore.ExternalExpertReputationThreshold,\n                1);\n\n            StoreReputation.UpdateReputation();\n        }\n\n        private static void EnsurePerk(\n            StoreReputation reputation,\n            string perkId,\n            int threshold,\n            int perkType)\n        {\n            for (int i = 0; i < reputation.perks.Count; i++)\n            {\n                if (reputation.perks[i].perkId == perkId)\n                {\n                    return;\n                }\n            }\n\n            reputation.perks.Add(new StoreReputationPerk\n            {\n                perkId = perkId,\n                perkThreshold = threshold,\n                perkType = perkType,\n                iconName = \"Referal\",\n            });\n        }\n\n        internal static int Get()\n        {\n            StoreReputation reputation\n                = StoreReputation.GetStoreReputation(FactionId);\n            return reputation == null ? 0 : reputation.GetReputation();\n        }\n\n        internal static void Add(double amount)\n        {\n            StoreReputation reputation\n                = StoreReputation.GetStoreReputation(FactionId);\n            reputation.ModReputation(amount);\n            ReputationUIManager.Instance.NotifyReputation(\n                FactionId,\n                (int)System.Math.Round(amount));\n        }\n\n        /// <summary>预留给后续医院 NPC 的普通交易接入；当前无调用方。<\/summary>\n        internal static void AddTrade(double cashValue)\n        {\n            Add(cashValue / 400d);\n        }\n    }\n}\n","src/Story/Hospital/HospitalReputationTexts.cs":"using UnityEngine.Localization.Settings;\n\nnamespace FluxForge.Story.Hospital\n{\n    /// <summary>医院自定义声望 perk 的运行时本地化。<\/summary>\n    internal static class HospitalReputationTexts\n    {\n        internal const string TrustedPerkId\n            = \"HOSPITAL_TRUSTED_SUPPLIER\";\n\n        internal const string AcePerkId\n            = \"HOSPITAL_ACE_SUPPLIER\";\n\n        internal const string TerminationPerkId\n            = \"HOSPITAL_CONTRACT_TERMINATED\";\n\n        internal const string TrustPaymentPerkId\n            = \"HOSPITAL_TRUST_PAYMENT\";\n\n        internal const string SpecialProcurementPerkId\n            = \"HOSPITAL_SPECIAL_PROCUREMENT\";\n\n        internal const string ExternalExpertPerkId\n            = \"HOSPITAL_EXTERNAL_EXPERT\";\n\n        internal static void Register()\n        {\n            var table = LocalizationSettings.StringDatabase.GetTable(\n                \"RepPerkTable\");\n\n            Add(\n                table,\n                TrustedPerkId,\n                ModHelper.GetLocalized(\"fluxforge\", \"reputation.hospital.trusted.name\"),\n                ModHelper.GetLocalized(\"fluxforge\", \"reputation.hospital.trusted.description\"),\n                ModHelper.GetLocalized(\"fluxforge\", \"reputation.hospital.trusted.flavor\"));\n\n            Add(\n                table,\n                AcePerkId,\n                ModHelper.GetLocalized(\"fluxforge\", \"reputation.hospital.ace.name\"),\n                ModHelper.GetLocalized(\"fluxforge\", \"reputation.hospital.ace.description\"),\n                ModHelper.GetLocalized(\"fluxforge\", \"reputation.hospital.ace.flavor\"));\n\n            Add(\n                table,\n                TrustPaymentPerkId,\n                ModHelper.GetLocalized(\"fluxforge\", \"reputation.hospital.payment.name\"),\n                ModHelper.GetLocalized(\"fluxforge\", \"reputation.hospital.payment.description\"),\n                ModHelper.GetLocalized(\"fluxforge\", \"reputation.hospital.payment.flavor\"));\n\n            Add(\n                table,\n                SpecialProcurementPerkId,\n                ModHelper.GetLocalized(\"fluxforge\", \"reputation.hospital.procurement.name\"),\n                ModHelper.GetLocalized(\"fluxforge\", \"reputation.hospital.procurement.description\"),\n                ModHelper.GetLocalized(\"fluxforge\", \"reputation.hospital.procurement.flavor\"));\n\n            Add(\n                table,\n                TerminationPerkId,\n                ModHelper.GetLocalized(\"fluxforge\", \"reputation.hospital.termination.name\"),\n                ModHelper.GetLocalized(\"fluxforge\", \"reputation.hospital.termination.description\"),\n                ModHelper.GetLocalized(\"fluxforge\", \"reputation.hospital.termination.flavor\"));\n\n            Add(\n                table,\n                ExternalExpertPerkId,\n                ModHelper.GetLocalized(\"fluxforge\", \"reputation.hospital.expert.name\"),\n                ModHelper.GetLocalized(\"fluxforge\", \"reputation.hospital.expert.description\"),\n                ModHelper.GetLocalized(\"fluxforge\", \"reputation.hospital.expert.flavor\"));\n        }\n\n        private static void Add(\n            UnityEngine.Localization.Tables.StringTable table,\n            string perkId,\n            string name,\n            string description,\n            string flavor)\n        {\n            table.AddEntry(\n                \"rep_perk_\" + perkId + \"_name\",\n                name);\n            table.AddEntry(\n                \"rep_perk_\" + perkId + \"_desc\",\n                description);\n            table.AddEntry(\n                \"rep_perk_\" + perkId + \"_flavor\",\n                flavor);\n        }\n    }\n}\n","src/Story/Hospital/HospitalStoryPoints.cs":"namespace FluxForge.Story.Hospital\n{\n    /// <summary>医院正常业务为独立剧情开放的内容插入位置。<\/summary>\n    internal static class HospitalStoryPoints\n    {\n        internal const string MaterialDelivered = \"hospital.material_delivered\";\n        internal const string PickupSettled = \"hospital.pickup_settled\";\n    }\n}\n","src/Story/Hospital/Patches/HospitalClientCreationPatch.cs":"using HarmonyLib;\n\nnamespace FluxForge.Story.Hospital\n{\n    /// <summary>把自定义医院派系接入原版上层医院采购员使用的鉴别流程。<\/summary>\n    [HarmonyPatch(typeof(StoreClient), \"CompleteClientCreation\")]\n    internal static class HospitalClientCreationPatch\n    {\n        internal static void Postfix(StoreClient __instance, bool IgnoreExposeFunc)\n        {\n            if (!IgnoreExposeFunc && __instance.clientFaction == HospitalReputation.FactionId)\n            {\n                __instance.canClientExposeFeature = ClientCanExposeFunc.ULClientExposeCapacity;\n            }\n        }\n    }\n}\n","src/Story/Hospital/Procurement/HospitalProcurement.cs":"namespace FluxForge.Story.Hospital\n{\n    /// <summary>在原版每日顾客生成阶段追加特殊采购客人。<\/summary>\n    internal sealed class HospitalProcurement\n    {\n        private readonly string[] _clientIds;\n\n        internal HospitalProcurement(string[] clientIds)\n        {\n            _clientIds = clientIds;\n        }\n\n        internal void Subscribe()\n        {\n            ModHook.OnGenerateCustomerLate += QueueClient;\n        }\n\n        internal void Dispose()\n        {\n            ModHook.OnGenerateCustomerLate -= QueueClient;\n            // 原版 PlayerStore.Instance 会懒建存档，菜单中注销时不能读取它。\n            if (!PlayerStore.HasInstance)\n            {\n                return;\n            }\n\n            PlayerStore store = PlayerStore.Instance;\n            store.storeClientManager.clientStack.RemoveAll(IsProcurementClient);\n            StoreClientInstance current = store.currentClientInstance;\n            if (current != null && IsProcurementClient(current.GetClientBlueprint()))\n            {\n                store.DismissCurrentClient(callNextWhenPossible: false);\n            }\n        }\n\n        private bool IsProcurementClient(StoreClient client)\n        {\n            for (int i = 0; i < _clientIds.Length; i++)\n            {\n                if (_clientIds[i] == client.identifier)\n                {\n                    return true;\n                }\n            }\n            return false;\n        }\n\n        private void QueueClient(StoreClientManager manager)\n        {\n            if (StoreReputation.IsPerkUnlocked(\n                    HospitalReputationTexts.SpecialProcurementPerkId)\n                && RNG.Roll(10))\n            {\n                int index = RNG.GetRandomInt(0, _clientIds.Length - 1);\n                manager.AddClient(StoreClientListDict.CreateStoreClient(_clientIds[index]));\n            }\n        }\n    }\n}\n","src/Story/Hospital/Procurement/Patches/HospitalCrimeModifierPatch.cs":"using System;\nusing HarmonyLib;\n\nnamespace FluxForge.Story.Hospital\n{\n    /// <summary>在原版派系犯罪价值修正入口沿用“守口如瓶”的整数减半。<\/summary>\n    [HarmonyPatch(typeof(SecData), \"ApplyCrimeModifier\", new Type[] { typeof(string), typeof(int) })]\n    internal static class HospitalCrimeModifierPatch\n    {\n        internal static bool Prefix(string factionId, int value, ref int __result)\n        {\n            if (factionId == HospitalReputation.FactionId\n                && StoreReputation.IsPerkUnlocked(\n                    HospitalReputationTexts.SpecialProcurementPerkId))\n            {\n                __result = value / 2;\n                return false;\n            }\n\n            return true;\n        }\n    }\n}\n","src/Story/Hospital/Procurement/Services/HospitalProcurementClients.cs":"namespace FluxForge.Story.Hospital\n{\n    /// <summary>中心医院访客的原版客户工厂与采购名单。<\/summary>\n    internal static class HospitalProcurementClients\n    {\n        internal const string Visitor01Id = \"fluxforge_hospital_visitor_01\";\n        internal const string Visitor02Id = \"fluxforge_hospital_visitor_02\";\n        internal const string Visitor03Id = \"fluxforge_hospital_visitor_03\";\n        internal const string Visitor04Id = \"fluxforge_hospital_visitor_04\";\n        internal static string DisplayName\n        {\n            get { return ModHelper.GetLocalized(\"fluxforge\", \"npc.hospital_visitor.name\"); }\n        }\n\n        internal static readonly string[] Identifiers =\n        {\n            Visitor01Id, Visitor02Id, Visitor03Id, Visitor04Id,\n        };\n\n        internal static void Register()\n        {\n            StoreClientListDict.storeClientDict.Add(Visitor01Id, CreateVisitor01);\n            StoreClientListDict.storeClientDict.Add(Visitor02Id, CreateVisitor02);\n            StoreClientListDict.storeClientDict.Add(Visitor03Id, CreateVisitor03);\n            StoreClientListDict.storeClientDict.Add(Visitor04Id, CreateVisitor04);\n        }\n\n        internal static void Unregister()\n        {\n            for (int i = 0; i < Identifiers.Length; i++)\n            {\n                StoreClientListDict.storeClientDict.Remove(Identifiers[i]);\n            }\n            StoreClientListDict.ClearDisplayNameCache();\n        }\n\n        private static StoreClient CreateVisitor01()\n        {\n            return Create(Visitor01Id, \"npc_hospital_visitor_01\", HospitalVisitorTexts.Visitor01);\n        }\n\n        private static StoreClient CreateVisitor02()\n        {\n            return Create(Visitor02Id, \"npc_hospital_visitor_02\", HospitalVisitorTexts.Visitor02);\n        }\n\n        private static StoreClient CreateVisitor03()\n        {\n            return Create(Visitor03Id, \"npc_hospital_visitor_03\", HospitalVisitorTexts.Visitor03);\n        }\n\n        private static StoreClient CreateVisitor04()\n        {\n            return Create(Visitor04Id, \"npc_hospital_visitor_04\", HospitalVisitorTexts.Visitor04);\n        }\n\n        private static StoreClient Create(string identifier, string spriteKey, string[] greetings)\n        {\n            StoreClient client = new StoreClient();\n            client.identifier = identifier;\n            client.displayName = DisplayName;\n            client.spriteName = spriteKey;\n            client.clientFaction = HospitalReputation.FactionId;\n            client.clientIntent = StoreClient.ClientIntent.BUY;\n            client.IsPersonalConsumption = false;\n            client.CanExposeChem = true;\n            client.SetBudget(RNG.GetRandomInt(250, 300) + StoreStation.GetDayCounter() * 2);\n            client.clientBuyingTagList.Add(\"ALL_TYPE\");\n\n            Dialogue line = client.mainDialogue;\n            for (int i = 0; i < greetings.Length; i++)\n            {\n                line.SetText(DisplayName, greetings[i]);\n                if (i < greetings.Length - 1)\n                {\n                    line = line.NextDialogue();\n                }\n            }\n\n            client.AddBasicDialog();\n            client.CompleteClientCreation();\n            ModHelper.SetClientSource(client, \"fluxforge\");\n            return client;\n        }\n    }\n}\n","src/Story/Hospital/Procurement/Services/Texts/HospitalVisitorTexts.cs":"namespace FluxForge.Story.Hospital\n{\n    internal static class HospitalVisitorTexts\n    {\n        internal static string[] Visitor01\n        {\n            get\n            {\n                return new string[]\n                {\n                    ModHelper.GetLocalized(\"fluxforge\", \"story.HospitalVisitorTexts.Visitor01.1\"),\n                    ModHelper.GetLocalized(\"fluxforge\", \"story.HospitalVisitorTexts.Visitor01.2\"),\n                };\n            }\n        }\n\n        internal static string[] Visitor02\n        {\n            get\n            {\n                return new string[]\n                {\n                    ModHelper.GetLocalized(\"fluxforge\", \"story.HospitalVisitorTexts.Visitor02.1\"),\n                    ModHelper.GetLocalized(\"fluxforge\", \"story.HospitalVisitorTexts.Visitor02.2\"),\n                };\n            }\n        }\n\n        internal static string[] Visitor03\n        {\n            get\n            {\n                return new string[]\n                {\n                    ModHelper.GetLocalized(\"fluxforge\", \"story.HospitalVisitorTexts.Visitor03.1\"),\n                    ModHelper.GetLocalized(\"fluxforge\", \"story.HospitalVisitorTexts.Visitor03.2\"),\n                };\n            }\n        }\n\n        internal static string[] Visitor04\n        {\n            get\n            {\n                return new string[]\n                {\n                    ModHelper.GetLocalized(\"fluxforge\", \"story.HospitalVisitorTexts.Visitor04.1\"),\n                    ModHelper.GetLocalized(\"fluxforge\", \"story.HospitalVisitorTexts.Visitor04.2\"),\n                    ModHelper.GetLocalized(\"fluxforge\", \"story.HospitalVisitorTexts.Visitor04.3\"),\n                };\n            }\n        }\n    }\n}\n","src/Story/Npcs/AcidBuyer/AcidBuyerProgress.cs":"namespace FluxForge.Story.AcidBuyer\n{\n    internal static class AcidBuyerProgress\n    {\n        private const string MetKey\n            = \"fluxforge.acidBuyer.met\";\n\n        private const string HighPurityDialogueDoneKey\n            = \"vera.high_purity_dialogue_done\";\n\n        internal static bool HasMet\n        {\n            get\n            {\n                return PlayerStore.Instance.modData.ContainsKey(MetKey);\n            }\n        }\n\n        internal static void MarkMet()\n        {\n            PlayerStore.Instance.modData[MetKey] = \"1\";\n        }\n\n        internal static bool HasHighPurityDialogueDone\n        {\n            get\n            {\n                return PlayerStore.Instance.modData.ContainsKey(\n                    HighPurityDialogueDoneKey);\n            }\n        }\n\n        internal static void MarkHighPurityDialogueDone()\n        {\n            PlayerStore.Instance.modData[HighPurityDialogueDoneKey] = \"1\";\n        }\n    }\n}\n","src/Story/Npcs/AcidBuyer/AcidBuyerStock.cs":"using FluxForge.Mod;\n\nnamespace FluxForge.Story.AcidBuyer\n{\n    /// <summary>\n    /// 首次到访赠送两瓶受污染酸液、两瓶受污染碱液。\n    /// 使用原版 250 mL 化学试剂瓶（mini_bottle），成分随机生成。\n    /// <\/summary>\n    internal static class AcidBuyerStock\n    {\n        private const int BottleCapacity = 250000;\n        private const int BottlesPerType = 2;\n        private const int PollutionMin = 87500;\n        private const int PollutionMax = 112500;\n\n        internal static void GiveRaw()\n        {\n            for (int i = 0; i < BottlesPerType; i++)\n            {\n                GiveBottle(true);\n            }\n\n            for (int i = 0; i < BottlesPerType; i++)\n            {\n                GiveBottle(false);\n            }\n        }\n\n        private static void GiveBottle(bool acid)\n        {\n            GameItem item = PreBuiltItemHelper.CreateChemicalBottle(\n                acid ? \"acid\" : \"base\");\n\n            int pollution = RNG.GetRandomInt(PollutionMin, PollutionMax);\n            int chemical = Share(pollution, 0.12f, 0.20f);\n            int heavyMetal = Share(pollution, 0.08f, 0.15f);\n            int microplastic = Share(pollution, 0.06f, 0.12f);\n            int physical = Share(pollution, 0.06f, 0.12f);\n            int mineral = Share(pollution, 0.04f, 0.08f);\n            int debris = Share(pollution, 0.04f, 0.08f);\n\n            int active = BottleCapacity\n                - chemical\n                - heavyMetal\n                - microplastic\n                - physical\n                - mineral\n                - debris;\n\n            FlowProperties properties = new FlowProperties();\n            properties.Set(\n                acid ? FlowProps.Acid : FlowProps.Base,\n                active);\n            properties.Set(FlowProps.ChemicalContaminant, chemical);\n            properties.Set(FlowProps.HeavyMetal, heavyMetal);\n            properties.Set(FlowProps.Microplastic, microplastic);\n            properties.Set(FlowProps.PhysicalContaminant, physical);\n            properties.Set(FlowProps.Mineral, mineral);\n            properties.Set(FlowProps.Debris, debris);\n            properties.Set(FlowProps.Temperature, 20d);\n            FlowStock.Write(item, properties);\n\n            item.name = ModHelper.GetLocalized(\"fluxforge\", acid ? \"item.stock.polluted_acid.name\" : \"item.stock.polluted_base.name\");\n            GeneralHelper.SetItemOwned(item, true);\n            GraphUtils.EmporiumTryAdd(\n                EmporiumEntry.Instance.frontInvinvElement,\n                item);\n        }\n\n        private static int Share(int total, float min, float max)\n        {\n            return RNG.GetRandomInt(\n                (int)(total * min),\n                (int)(total * max));\n        }\n    }\n}\n","src/Story/Npcs/AcidBuyer/AcidBuyerStory.cs":"using System.Linq;\nusing FluxForge.Story.AcidBuyerArrival;\nusing FluxForge.Story.AcidBuyerRepeatVisit;\nusing FluxForge.Story.FlowEmitterMerchant;\nusing FluxForge.Story.Hospital;\nusing FluxForge.Story.Portraits;\n\nnamespace FluxForge.Story.AcidBuyer\n{\n    /// <summary>薇拉的访客身份、到访规则和剧情事件注册。<\/summary>\n    internal static class AcidBuyerStory\n    {\n        internal static void RestoreAfterLoad()\n        {\n            if (HospitalContractState.Started)\n            {\n                HospitalReputation.EnsureFaction();\n                return;\n            }\n\n            if (AcidBuyerProgress.HasHighPurityDialogueDone\n                && !HospitalContractState.OfferDeclined)\n            {\n                HospitalContractState.QueueOffer();\n            }\n        }\n\n        internal static NpcStoryContent Create()\n        {\n            NpcDefinition definition = new NpcDefinition(\n                \"fluxforge_acid_buyer\",\n                \"npc.vera.name\",\n                NpcPortraitRegistry.AcidBuyerSpriteKey,\n                null,\n                false,\n                HospitalReputation.FactionId);\n\n            VisitRule visit = new VisitRule(\n                \"acid_buyer.seven_days\",\n                definition.Identifier,\n                10,\n                1d,\n                7,\n                VisitKind.Dialogue,\n                delegate\n                {\n                    return FlowEmitterMerchantProgress.HasArrivalSeen\n                        && (!HospitalContractState.Started || HospitalContractState.Terminated);\n                },\n                null);\n\n            VisitRule contractPickup = new VisitRule(\n                \"acid_buyer.contract_pickup\",\n                definition.Identifier,\n                110,\n                1d,\n                0,\n                VisitKind.Dialogue,\n                delegate(VisitContext context)\n                {\n                    return HospitalContractState.ShouldRunPickup(\n                        context.Day);\n                },\n                null);\n\n            VisitRule synaprestOfferVisit = new VisitRule(\n                \"acid_buyer.synaprest_offer\", definition.Identifier,\n                120, 1d, 1, VisitKind.Dialogue,\n                delegate(VisitContext context) { return HospitalSynaprestState.CanOffer(context.Day); },\n                null);\n\n            StoryEvent synaprestOffer = new StoryEvent(\n                \"hospital.synaprest.offer\", definition.Identifier,\n                StoryTrigger.VisitStarted, 270, 0, null,\n                delegate(StoryContext context) { return HospitalSynaprestState.CanOffer(context.Day); });\n\n            VisitRule contractMaterial = new VisitRule(\n                \"acid_buyer.contract_material\",\n                definition.Identifier,\n                105,\n                1d,\n                0,\n                VisitKind.Dialogue,\n                delegate(VisitContext context)\n                {\n                    return HospitalContractState.ShouldRunMaterial(\n                        context.Day);\n                },\n                null);\n\n            StoryEvent arrival = new StoryEvent(\n                \"acid_buyer.arrival\",\n                definition.Identifier,\n                StoryTrigger.VisitStarted,\n                100,\n                1,\n                null,\n                delegate { return !AcidBuyerProgress.HasMet; });\n\n            StoryEvent repeatVisit = new StoryEvent(\n                \"acid_buyer.repeat_visit\",\n                definition.Identifier,\n                StoryTrigger.VisitStarted,\n                10,\n                0,\n                null,\n                delegate { return true; });\n\n            StoryEvent contractOffer = new StoryEvent(\n                HospitalContractOfferAssembly.EventId,\n                definition.Identifier,\n                StoryTrigger.VisitStarted,\n                150,\n                0,\n                null,\n                delegate\n                {\n                    return HospitalContractState.OfferReady\n                        && !HospitalContractState.Started\n                        && !HospitalContractState.OfferDeclined;\n                });\n\n            StoryEvent contractPickupEvent = new StoryEvent(\n                \"acid_buyer.contract_pickup\",\n                definition.Identifier,\n                StoryTrigger.VisitStarted,\n                200,\n                0,\n                null,\n                delegate(StoryContext context)\n                {\n                    return HospitalContractState.ShouldRunPickup(\n                        context.Day);\n                });\n\n            StoryEvent contractMaterialEvent = new StoryEvent(\n                \"acid_buyer.contract_material\",\n                definition.Identifier,\n                StoryTrigger.VisitStarted,\n                190,\n                0,\n                null,\n                delegate(StoryContext context)\n                {\n                    return HospitalContractState.ShouldRunMaterial(\n                        context.Day);\n                });\n\n            StoryEvent contractTermination = new StoryEvent(\n                \"acid_buyer.contract_termination\",\n                definition.Identifier,\n                StoryTrigger.VisitStarted,\n                300,\n                1,\n                null,\n                delegate\n                {\n                    return HospitalContractState.Started\n                        && !HospitalContractState.Terminated\n                        && HospitalReputation.Get() <= -20;\n                });\n\n            StoryEvent reputation20 = new StoryEvent(\n                \"acid_buyer.hospital_rep20\",\n                definition.Identifier,\n                HospitalStoryPoints.MaterialDelivered,\n                250,\n                1,\n                null,\n                delegate(StoryContext context)\n                {\n                    return HospitalContractState.Started\n                        && !HospitalContractState.Terminated\n                        && HospitalReputation.Get() >= 20\n                        && context.State.SeenCount(\n                            \"acid_buyer.hospital_rep40\") == 0;\n                });\n\n            StoryEvent reputation40 = new StoryEvent(\n                \"acid_buyer.hospital_rep40\",\n                definition.Identifier,\n                HospitalStoryPoints.MaterialDelivered,\n                260,\n                1,\n                null,\n                delegate\n                {\n                    return HospitalContractState.Started\n                        && !HospitalContractState.Terminated\n                        && HospitalReputation.Get() >= 40;\n                });\n\n            return new NpcStoryContent(\n                definition,\n                new[] { visit, contractPickup, contractMaterial, synaprestOfferVisit },\n                new[]\n                {\n                    new StoryEventDefinition(\n                        synaprestOffer,\n                        new HospitalSynaprestOfferAssembly(),\n                        StoryOutcome.Leave),\n                    new StoryEventDefinition(\n                        arrival,\n                        new AcidBuyerArrivalAssembly(),\n                        StoryOutcome.Leave),\n                    new StoryEventDefinition(\n                        repeatVisit,\n                        new AcidBuyerRepeatVisitAssembly(),\n                        StoryOutcome.Leave),\n                    new StoryEventDefinition(\n                        contractOffer,\n                        new HospitalContractOfferAssembly(new NpcState(definition)),\n                        StoryOutcome.Leave),\n                    new StoryEventDefinition(\n                        contractPickupEvent,\n                        new HospitalContractPickupAssembly(),\n                        StoryOutcome.Leave),\n                    new StoryEventDefinition(\n                        contractMaterialEvent,\n                        new HospitalContractMaterialAssembly(),\n                        StoryOutcome.Leave),\n                    new StoryEventDefinition(\n                        contractTermination,\n                        new HospitalContractTerminationAssembly(),\n                        StoryOutcome.Leave),\n                    new StoryEventDefinition(\n                        reputation20,\n                        new HospitalContractMilestoneAssembly(20),\n                        StoryOutcome.Default),\n                    new StoryEventDefinition(\n                        reputation40,\n                        new HospitalContractMilestoneAssembly(40),\n                        StoryOutcome.Default),\n                }.Concat(HospitalHighestDemand.CreateEvents(definition.Identifier)).ToArray(),\n                visit);\n        }\n    }\n}\n","src/Story/Npcs/AcidBuyer/AcidBuyerTrade.cs":"using System;\nusing System.Collections.Generic;\nusing FluxForge.Mod;\n\nnamespace FluxForge.Story.AcidBuyer\n{\n    internal enum AcidBuyerTradeResult\n    {\n        NoAcidOrBase,\n        ConcentrationTooLow,\n        Success,\n    }\n\n    /// <summary>\n    /// 酸/碱收货：扫描后柜台，跳过流体装置，按最低 90% 浓度门槛整瓶收购。\n    /// 将本批 >=99% 的交付体积计入本次到访，供首次问答与告别判定。\n    /// <\/summary>\n    internal static class AcidBuyerTrade\n    {\n        private const double MinimumConcentration = 0.90d;\n        private const double HighConcentration = 0.99d;\n        private const double PureConcentration = 1d - 1e-9d;\n\n        internal static AcidBuyerTradeResult TrySellAll(\n            AcidBuyerTradeSession session, out int reward)\n        {\n            reward = 0;\n\n            GameInventory counter = EmporiumEntry.Instance.backInvinvElement;\n            List<GameItem> qualified = new List<GameItem>();\n            bool sawAcidOrBase = false;\n            int highPurityVolume = 0;\n\n            for (int i = 0; i < counter.childItems.Count; i++)\n            {\n                GameItem item = counter.childItems[i];\n                if (!item.IsTag(FlowTags.LiquidContainerTag)\n                    || item.IsTag(FlowTags.FlowDevice))\n                {\n                    continue;\n                }\n\n                FlowProperties properties = FlowStock.Read(item);\n                double acid = properties.Get(FlowProps.Acid);\n                double baseAmount = properties.Get(FlowProps.Base);\n                double active = Math.Max(acid, baseAmount);\n\n                if (active <= 0d)\n                {\n                    continue;\n                }\n\n                sawAcidOrBase = true;\n\n                double total = properties.SubstanceTotal;\n                double concentration = active / total;\n                if (concentration + 1e-9d < MinimumConcentration)\n                {\n                    continue;\n                }\n\n                qualified.Add(item);\n                reward += Price(properties, concentration);\n                if (concentration + 1e-9d >= HighConcentration)\n                {\n                    highPurityVolume += (int)Math.Round(total);\n                }\n            }\n\n            if (!sawAcidOrBase)\n            {\n                return AcidBuyerTradeResult.NoAcidOrBase;\n            }\n\n            if (qualified.Count == 0)\n            {\n                return AcidBuyerTradeResult.ConcentrationTooLow;\n            }\n\n            for (int i = 0; i < qualified.Count; i++)\n            {\n                qualified[i].Destroy();\n            }\n\n            PlayerStore.Instance.ModCash(reward);\n            session.RecordHighPurityDelivery(\n                highPurityVolume);\n\n            return AcidBuyerTradeResult.Success;\n        }\n\n        private static int Price(FlowProperties properties, double concentration)\n        {\n            double volumeMillilitres = properties.SubstanceTotal / 1000d;\n\n            double basePrice = volumeMillilitres / 10d;\n\n            if (concentration + 1e-9d < HighConcentration)\n            {\n                return (int)Math.Floor(basePrice);\n            }\n\n            double multiplier;\n            if (concentration >= PureConcentration)\n            {\n                multiplier = 3d;\n            }\n            else\n            {\n                double steps = (concentration - HighConcentration) / 0.001d;\n                multiplier = 1d + steps * 0.1d;\n            }\n\n            return (int)Math.Floor(basePrice * multiplier);\n        }\n    }\n}\n","src/Story/Npcs/AcidBuyer/AcidBuyerTradeSession.cs":"namespace FluxForge.Story.AcidBuyer\n{\n    /// <summary>累计本次到访各批高浓度交付体积，供首次问答和告别判定；所有交易边共享。<\/summary>\n    internal sealed class AcidBuyerTradeSession\n    {\n        private const int SufficientHighPurityVolume = 100000;\n        private int _highPurityVolume;\n\n        internal bool ShouldShowHighPurityDialogue\n        {\n            get\n            {\n                return _highPurityVolume > 0\n                    && !AcidBuyerProgress.HasHighPurityDialogueDone;\n            }\n        }\n\n        internal bool HasSufficientHighPurity\n        {\n            get { return _highPurityVolume >= SufficientHighPurityVolume; }\n        }\n\n        internal void BeginVisit()\n        {\n            _highPurityVolume = 0;\n        }\n\n        internal void RecordHighPurityDelivery(int volume)\n        {\n            _highPurityVolume += volume;\n        }\n    }\n}\n","src/Story/Npcs/AcidBuyer/Events/AcidBuyerArrival/AcidBuyerArrivalAssembly.cs":"using FluxForge.Story.AcidBuyer;\nusing FluxForge.Story.AcidBuyerFirstHighPurity;\n\nnamespace FluxForge.Story.AcidBuyerArrival\n{\n    /// <summary>首次到访：开场中赠送原料，再进入交易选项；正常结束时记录已见面。<\/summary>\n    internal sealed class AcidBuyerArrivalAssembly : StoryAssembly\n    {\n        internal override StoryEdge Entry { get; }\n\n        internal override void Complete()\n        {\n            AcidBuyerProgress.MarkMet();\n        }\n\n        internal AcidBuyerArrivalAssembly()\n        {\n            AcidBuyerTradeSession session = new AcidBuyerTradeSession();\n            StoryNode root = new StoryNode();\n            StoryNode success = new StoryNode();\n            StoryNode highPurity = new StoryNode();\n            AcidBuyerGreetingEdge greeting = new AcidBuyerGreetingEdge(session);\n            AcidBuyerTradeEdge trade = new AcidBuyerTradeEdge(session);\n            AcidBuyerTradeEdge tradeAgain = new AcidBuyerTradeEdge(session);\n            AcidBuyerExitEdge exit = new AcidBuyerExitEdge();\n            AcidBuyerSoldOutEdge soldOut = new AcidBuyerSoldOutEdge(session);\n            AcidBuyerHighPurityAnswerEdge selfMade\n                = new AcidBuyerHighPurityAnswerEdge(\n                    AcidBuyerFirstHighPurityTexts.SelfMadeOption,\n                    AcidBuyerFirstHighPurityTexts.SelfMadeResponse);\n            AcidBuyerHighPurityAnswerEdge luck\n                = new AcidBuyerHighPurityAnswerEdge(\n                    AcidBuyerFirstHighPurityTexts.LuckOption,\n                    AcidBuyerFirstHighPurityTexts.LuckResponse);\n\n            greeting.Connect(null, root);\n            trade.Connect(root, success);\n            trade.SetTargets(success, highPurity, root);\n            exit.Connect(root, null);\n\n            tradeAgain.Connect(success, success);\n            tradeAgain.SetTargets(success, highPurity, success);\n            soldOut.Connect(success, null);\n\n            selfMade.Connect(highPurity, success);\n            luck.Connect(highPurity, success);\n\n            Entry = greeting;\n        }\n    }\n}\n","src/Story/Npcs/AcidBuyer/Events/AcidBuyerArrival/AcidBuyerArrivalTexts.cs":"namespace FluxForge.Story.AcidBuyerArrival\n{\n    /// <summary>首次到访的纯对话文本。<\/summary>\n    internal static class AcidBuyerArrivalTexts\n    {\n        internal const string Line1\n            = \"story.AcidBuyerArrivalTexts.Line1\";\n\n        internal const string Line2\n            = \"story.AcidBuyerArrivalTexts.Line2\";\n\n        internal const string Line3\n            = \"story.AcidBuyerArrivalTexts.Line3\";\n\n        internal const string Line4\n            = \"story.AcidBuyerArrivalTexts.Line4\";\n\n        internal const string PriceIntro\n            = \"story.AcidBuyerArrivalTexts.PriceIntro\";\n\n        internal const string PriceStep\n            = \"story.AcidBuyerArrivalTexts.PriceStep\";\n\n        internal const string PricePure\n            = \"story.AcidBuyerArrivalTexts.PricePure\";\n\n        inte uyerTradeResult.ConcentrationTooLow)\n            {\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", AcidBuyerArrivalTexts.ConcentrationTooLow));\n            }\n            else\n            {\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", AcidBuyerArrivalTexts.Success));\n                if (_session.ShouldShowHighPurityDialogue)\n                {\n                    player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", AcidBuyerFirstHighPurityTexts.Inspection));\n                    player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", AcidBuyerFirstHighPurityTexts.Question));\n                }\n                else\n                {\n                    player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", AcidBuyerArrivalTexts.ContinueQuestion));\n                }\n            }\n\n        }\n    }\n\n    internal sealed class AcidBuyerExitEdge : StoryEdge\n    {\n        internal AcidBuyerExitEdge()\n            : base(AcidBuyerArrivalTexts.ExitOption, \"question\")\n        {\n        }\n\n        internal override void Execute(StorySequence player)\n        {\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", AcidBuyerArrivalTexts.ExitLine));\n        }\n    }\n\n    internal sealed class AcidBuyerSoldOutEdge : StoryEdge\n    {\n        private readonly AcidBuyerTradeSession _session;\n\n        internal AcidBuyerSoldOutEdge(AcidBuyerTradeSession session)\n            : base(AcidBuyerArrivalTexts.SoldOutOption, \"question\")\n        {\n            _session = session;\n        }\n\n        internal override void Execute(StorySequence player)\n        {\n            player.SayNpc(\n                _session.HasSufficientHighPurity\n                    ? ModHelper.GetLocalized(\"fluxforge\", AcidBuyerArrivalTexts.SoldOutHigh)\n                    : ModHelper.GetLocalized(\"fluxforge\", AcidBuyerArrivalTexts.SoldOutLow));\n        }\n    }\n}\n","src/Story/Npcs/AcidBuyer/Events/AcidBuyerFirstHighPurity/AcidB dOut.Connect(success, null);\n\n            selfMade.Connect(highPurity, success);\n            luck.Connect(highPurity, success);\n\n            return root;\n        }\n    }\n}\n","src/Story/Npcs/AcidBuyer/Events/AcidBuyerRepeatVisit/AcidBuyerRepeatVisitTexts.cs":"namespace FluxForge.Story.AcidBuyerRepeatVisit\n{\n    /// <summary>再次到访的纯对话文本。<\/summary>\n    internal static class AcidBuyerRepeatVisitTexts\n    {\n        internal const string Line1\n            = \"story.AcidBuyerRepeatVisitTexts.Line1\";\n\n        internal const string Line2\n            = \"story.AcidBuyerRepeatVisitTexts.Line2\";\n\n        internal const string TradeOption\n            = \"story.AcidBuyerRepeatVisitTexts.TradeOption\";\n\n        internal const string ExitOption\n            = \"story.AcidBuyerRepeatVisitTexts.ExitOption\";\n\n        internal const string ExitLine\n            = \"story.AcidBuyerRepeatVisitTexts.ExitLine\";\n\n        internal const string SoldOutOption\n            = \"story.AcidBuyerRepeatVisitTexts.SoldOutOption\";\n\n        internal const string SoldOutHigh\n            = \"story.AcidBuyerRepeatVisitTexts.SoldOutHigh\";\n\n        internal const string SoldOutLow\n            = \"story.AcidBuyerRepeatVisitTexts.SoldOutLow\";\n\n        internal const string NoAcidOrBase\n            = \"story.AcidBuyerRepeatVisitTexts.NoAcidOrBase\";\n\n        internal const string ConcentrationTooLow\n            = \"story.AcidBuyerRepeatVisitTexts.ConcentrationTooLow\";\n\n        internal const string Success\n            = \"story.AcidBuyerRepeatVisitTexts.Success\";\n\n        internal const string ContinueQuestion\n            = \"story.AcidBuyerRepeatVisitTexts.ContinueQuestion\";\n    }\n}\n","src/Story/Npcs/AcidBuyer/Events/AcidBuyerRepeatVisit/Edges/AcidBuyerRepeatVisitEdges.cs":"using FluxForge.Story;\nusing FluxForge.Story.AcidBuyer;\nusing FluxForge.Story.AcidBuyerFirstHighPurity;\n\nnamespace FluxForge.Story.AcidBuyerRepeatVisit\n{\n    internal sealed c        player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", AcidBuyerRepeatVisitTexts.NoAcidOrBase));\n            }\n            else if (result == AcidBuyerTradeResult.ConcentrationTooLow)\n            {\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", AcidBuyerRepeatVisitTexts.ConcentrationTooLow));\n            }\n            else\n            {\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", AcidBuyerRepeatVisitTexts.Success));\n                if (_session.ShouldShowHighPurityDialogue)\n                {\n                    player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", AcidBuyerFirstHighPurityTexts.Inspection));\n                    player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", AcidBuyerFirstHighPurityTexts.Question));\n                }\n                else\n                {\n                    player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", AcidBuyerRepeatVisitTexts.ContinueQuestion));\n                }\n            }\n\n        }\n    }\n\n    internal sealed class AcidBuyerExitEdge : StoryEdge\n    {\n        internal AcidBuyerExitEdge()\n            : base(AcidBuyerRepeatVisitTexts.ExitOption, \"question\")\n        {\n        }\n\n        internal override void Execute(StorySequence player)\n        {\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", AcidBuyerRepeatVisitTexts.ExitLine));\n        }\n    }\n\n    internal sealed class AcidBuyerSoldOutEdge : StoryEdge\n    {\n        private readonly AcidBuyerTradeSession _session;\n\n        internal AcidBuyerSoldOutEdge(AcidBuyerTradeSession session)\n            : base(AcidBuyerRepeatVisitTexts.SoldOutOption, \"question\")\n        {\n            _session = session;\n        }\n\n        internal override void Execute(StorySequence player)\n        {\n            player.SayNpc(\n                _session.HasSufficientHighPurity\n                    ? ModHelper.GetLocalized(\"fluxforge\", AcidBuyerRepeatVisitTexts.SoldOutHigh)\n                    : ModHelper.GetLocalized(\"fluxforge\", AcidBuyerRepeatVisitTexts.SoldOutLow));\n        }\n    }\n}\n","src/Story/Npcs/FlowEmitterMerchant/Events/FlowEmitterArrival/Edges/FlowEmitterDeclineEdge.cs":"namespace FluxForge.Story.FlowEmitterArrival\n{\n    internal sealed class FlowEmitterDeclineEdge : StoryEdge\n    {\n        internal FlowEmitterDeclineEdge() : base(\"story.oya.option.decline\", null) { }\n        internal override void Execute(StorySequence player)\n        {\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Decline));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.DeclineFarewell1));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.DeclineFarewell2));\n        }\n    }\n}\n","src/Story/Npcs/FlowEmitterMerchant/Events/FlowEmitterArrival/Edges/FlowEmitterEncourageEdge.cs":"namespace FluxForge.Story.FlowEmitterArrival\n{\n    internal sealed class FlowEmitterEncourageEdge : StoryEdge\n    {\n        internal FlowEmitterEncourageEdge() : base(\"story.oya.option.failed\", null) { }\n        internal override void Execute(StorySequence player)\n        {\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Encourage1));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Encourage2));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Encourage3));\n            FlowEmitterArrivalDeparture.Append(player);\n        }\n    }\n}\n","src/Story/Npcs/FlowEmitterMerchant/Events/FlowEmitterArrival/Edges/FlowEmitterGreetingEdge.cs":"using FluxForge.Story.FlowEmitterMerchant;\n\nnamespace FluxForge.Story.FlowEmitterArrival\n{\n    /// <summary>首次到访：介绍用途并邀请玩家尝试。<\/summary>\n    internal sealed class FlowEmitterGreetingEdge : StoryEdge\n    {\n        internal FlowEmitterGreetingEdge()\n            : base(null, null)\n        {\n        }\n\n        internal override void Execute(StorySequence player)\n        {\n            if (FlowEmitterMerchantProgress.VisitCount > 1)\n            {\n                player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.RetryInvitation));\n                return;\n            }\n\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Greeting1));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Greeting2));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Purpose1));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Purpose2));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Invitation1));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Invitation2));\n\n        }\n    }\n}\n\n","src/Story/Npcs/FlowEmitterMerchant/Events/FlowEmitterArrival/Edges/FlowEmitterStarterGiftEdge.cs":"namespace FluxForge.Story.FlowEmitterArrival\n{\n    internal sealed class FlowEmitterStarterGiftEdge : StoryEdge\n    {\n        internal FlowEmitterStarterGiftEdge() : base(\"story.oya.option.accept\", null) { }\n        internal override void Execute(StorySequence player)\n        {\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Gift1));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Gift2));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Gift3));\n            player.Do(FlowEmitterArrivalMaterials.GiveStarterKit);\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Instructions1));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Instructions2));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Instructions3));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Instructions4));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Goal1));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Goal2));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Goal3));\n        }\n    }\n}\n","src/Story/Npcs/FlowEmitterMerchant/Events/FlowEmitterArrival/Edges/FlowEmitterSubmitAcidEdge.cs":"namespace FluxForge.Story.FlowEmitterArrival\n{\n    internal sealed class FlowEmitterSubmitAcidEdge : StoryEdge\n    {\n        internal bool Passed { get; private set; }\n        internal FlowEmitterSubmitAcidEdge() : base(\"story.oya.option.submit\", null) { }\n        internal override void Execute(StorySequence player)\n        {\n            AcidSubmission result = FlowEmitterArrivalMaterials.CheckAcid();\n            Passed = result == AcidSubmission.Passed;\n            if (!Passed)\n            {\n                if (result == AcidSubmission.Missing)\n                {\n                    player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Missing1));\n                    player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Missing2));\n                }\n                else\n                {\n                    player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.TooDilute1));\n                    player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.TooDilute2));\n                }\n                return;\n            }\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Success1));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Success2));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Success3));\n            FlowEmitterArrivalDeparture.Append(player);\n        }\n    }\n}\n","src/Story/Npcs/FlowEmitterMerchant/Events/FlowEmitterArrival/FlowEmitterArrivalAssembly.cs":"using FluxForge.Story.FlowEmitterMerchant;\n\nnamespace FluxForge.Story.FlowEmitterArrival\n{\n    /// <summary>\n    /// 首次体验线：邀请体验；接受后赠料，可提交验收或直接告别。\n    /// <\/summary>\n    internal sealed class FlowEmitterArrivalAssembly : StoryAssembly\n    {\n        internal override StoryEdge Entry { get; }\n\n        internal FlowEmitterArrivalAssembly()\n        {\n            FlowEmitterGreetingEdge greeting = new FlowEmitterGreetingEdge();\n            StoryNode interest = new StoryNode();\n            StoryNode work = new StoryNode();\n            greeting.Connect(null, interest);\n            interest.Connect(new FlowEmitterStarterGiftEdge(), work);\n            interest.Connect(new FlowEmitterDeclineEdge(), null);\n            FlowEmitterSubmitAcidEdge submit = new FlowEmitterSubmitAcidEdge();\n            work.Connect(submit, null);\n            submit.Branch(() => submit.Passed, null, work);\n            work.Connect(new FlowEmitterEncourageEdge(), null);\n            Entry = greeting;\n        }\n    }\n}\n","src/Story/Npcs/FlowEmitterMerchant/Events/FlowEmitterArrival/FlowEmitterArrivalDeparture.cs":"using FluxForge.Story.FlowEmitterMerchant;\n\nnamespace FluxForge.Story.FlowEmitterArrival\n{\n    internal static class FlowEmitterArrivalDeparture\n    {\n        internal static void Append(StorySequence player)\n        {\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.DepartureGift1));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.DepartureGift2));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.DepartureGift3));\n            player.Do(FlowEmitterArrivalMaterials.GiveDepartureGifts);\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Farewell1));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterArrivalTexts.Farewell2));\n            player.Do(FlowEmitterMerchantProgress.MarkArrivalSeen);\n        }\n    }\n}\n","src/Story/Npcs/FlowEmitterMerchant/Events/FlowEmitterArrival/FlowEmitterArrivalMaterials.cs":"using FluxForge.Mod;\nusing FluxForge.Story.FlowEmitterMerchant;\nnamespace FluxForge.Story.FlowEmitterArrival\n{\n    internal enum AcidSubmission { Missing, TooDilute, Passed }\n    internal static class FlowEmitterArrivalMaterials\n    {\n        internal static void GiveStarterKit()\n        {\n            GameItem acid = DirectoryMaster.Item(\"med_bottle_red\");\n            FlowProperties contents = new FlowProperties();\n            contents.Set(FlowProps.Acid, 90000);\n            contents.Set(FlowProps.ChemicalContaminant, 10000);\n            contents.Set(FlowProps.Temperature, FlowStock.Read(acid).Get(FlowProps.Temperature));\n            FlowStock.Write(acid, contents);\n            Give(acid);\n            GiveDevice(\"flow_emitter\", 2);\n            GiveDevice(\"flow_heater\", 1);\n            GiveDevice(\"flow_filter\", 1);\n            Give(DirectoryMaster.Item(\"fluxforge_starter_note\"));\n        }\n        internal static void GiveDepartureGifts()\n        {\n            GiveDevice(\"l_turn_device\", 4);\n            GiveDevice(\"flow_straight_speed\", 1);\n            GiveDevice(\"flow_cooler\", 1);\n        }\n        private static void GiveDevice(string key, int count)\n        {\n            for (int i = 0; i < count; i++)\n            {\n                GameItem item = DirectoryMaster.Item(key);\n                FlowEmitterMerchantStock.MarkShabby(item);\n                Give(item);\n            }\n        }\n        private static void Give(GameItem item)\n        {\n            GeneralHelper.SetItemOwned(item, true);\n            GraphUtils.EmporiumTryAdd(EmporiumEntry.Instance.frontInvinvElement, item);\n        }\n        internal static AcidSubmission CheckAcid()\n        {\n            bool found = false;\n            foreach (GameItem item in EmporiumEntry.Instance.backInvinvElement.childItems)\n            {\n                if (item.identifier != \"med_bottle_red\") continue;\n                FlowProperties contents = FlowStock.Read(item);\n                double acid = contents.Get(FlowProps.Acid);\n                if (acid <= 0) continue;\n                found = true;\n                if (acid >= contents.SubstanceTotal * 0.95)\n                    return AcidSubmission.Passed;\n            }\n            return found ? AcidSubmission.TooDilute : AcidSubmission.Missing;\n        }\n    }\n}\n","src/Story/Npcs/FlowEmitterMerchant/Events/FlowEmitterArrival/FlowEmitterArrivalTexts.cs":"namespace FluxForge.Story.FlowEmitterArrival\n{\n    internal static class FlowEmitterArrivalTexts\n    {\n        internal const string RetryInvitation\n            = \"story.FlowEmitterArrivalTexts.RetryInvitation\";\n\n        internal const string Greeting1\n            = \"story.FlowEmitterArrivalTexts.Greeting1\";\n\n        internal const string Greeting2\n            = \"story.FlowEmitterArrivalTexts.Greeting2\";\n\n        internal const string Purpose1\n            = \"story.FlowEmitterArrivalTexts.Purpose1\";\n\n        internal const string Purpose2\n            = \"story.FlowEmitterArrivalTexts.Purpose2\";\n\n        internal const string Invitation1\n            = \"story.FlowEmitterArrivalTexts.Invitation1\";\n\n        internal const string Invitation2\n            = \"story.FlowEmitterArrivalTexts.Invitation2\";\n\n        internal const string Gift1\n            = \"story.FlowEmitterArrivalTexts.Gift1\";\n\n        internal const string Gift2\n            = \"story.FlowEmitterArrivalTexts.Gift2\";\n\n        internal const string Gift3\n            = \"story.FlowEmitterArrivalTexts.Gift3\";\n\n        internal const string Instructions1\n            = \"story.FlowEmitterArrivalTexts.Instructions1\";\n\n        internal const string Instructions2\n            = \"story.FlowEmitterArrivalTexts.Instructions2\";\n\n        internal const string Instructions3\n            = \"story.FlowEmitterArrivalTexts.Instructions3\";\n\n        internal const string Instructions4\n            = \"story.FlowEmitterArrivalTexts.Instructions4\";\n\n        internal const string Goal1\n            = \"story.FlowEmitterArrivalTexts.Goal1\";\n\n        internal const string Goal2\n            = \"story.FlowEmitterArrivalTexts.Goal2\";\n\n        internal const string Goal3\n            = \"story.FlowEmitterArrivalTexts.Goal3\";\n\n        internal const string Missing1\n            = \"story.FlowEmitterArrivalTexts.Missing1\";\n\n        internal const string Missing2\n            = \"story.FlowEmitterArrivalTexts.Missing2\";\n\n        internal const string TooDilute1\n            = \"story.FlowEmitterArrivalTexts.TooDilute1\";\n\n        internal const string TooDilute2\n            = \"story.FlowEmitterArrivalTexts.TooDilute2\";\n\n        internal const string Success1\n            = \"story.FlowEmitterArrivalTexts.Success1\";\n\n        internal const string Success2\n            = \"story.FlowEmitterArrivalTexts.Success2\";\n\n        internal const string Success3\n            = \"story.FlowEmitterArrivalTexts.Success3\";\n\n        internal const string DepartureGift1\n            = \"story.FlowEmitterArrivalTexts.DepartureGift1\";\n\n        internal const string DepartureGift2\n            = \"story.FlowEmitterArrivalTexts.DepartureGift2\";\n\n        internal const string DepartureGift3\n            = \"story.FlowEmitterArrivalTexts.DepartureGift3\";\n\n        internal const string Encourage1\n            = \"story.FlowEmitterArrivalTexts.Encourage1\";\n\n        internal const string Encourage2\n            = \"story.FlowEmitterArrivalTexts.Encourage2\";\n\n        internal const string Encourage3\n            = \"story.FlowEmitterArrivalTexts.Encourage3\";\n\n        internal const string Decline\n            = \"story.FlowEmitterArrivalTexts.Decline\";\n\n        internal const string DeclineFarewell1\n            = \"story.FlowEmitterArrivalTexts.DeclineFarewell1\";\n\n        internal const string DeclineFarewell2\n            = \"story.FlowEmitterArrivalTexts.DeclineFarewell2\";\n\n        internal const string Farewell1\n            = \"story.FlowEmitterArrivalTexts.Farewell1\";\n\n        internal const string Farewell2\n            = \"story.FlowEmitterArrivalTexts.Farewell2\";\n\n    }\n}\n","src/Story/Npcs/FlowEmitterMerchant/Events/FlowEmitterGenericVisit/Edges/FlowEmitterGenericVisitEdge.cs":"\nnamespace FluxForge.Story.FlowEmitterGenericVisit\n{\n    /// <summary>通用到访的两句招呼。<\/summary>\n    internal sealed class FlowEmitterGenericVisitEdge : StoryEdge\n    {\n        internal FlowEmitterGenericVisitEdge()\n            : base(null, null)\n        {\n        }\n\n        internal override void Execute(StorySequence player)\n        {\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterGenericVisitTexts.Greeting));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterGenericVisitTexts.MoreItems));\n        }\n    }\n}\n","src/Story/Npcs/FlowEmitterMerchant/Events/FlowEmitterGenericVisit/FlowEmitterGenericVisitAssembly.cs":"using FluxForge.Story.FlowEmitterMerchant;\n\nnamespace FluxForge.Story.FlowEmitterGenericVisit\n{\n    /// <summary>没有专用剧情时播放通用开场，正常结束时按进度上货。<\/summary>\n    internal sealed class FlowEmitterGenericVisitAssembly : StoryAssembly\n    {\n        internal override StoryEdge Entry { get; }\n\n        internal override void Complete()\n        {\n            FlowEmitterMerchantStock.Refresh();\n        }\n\n        internal FlowEmitterGenericVisitAssembly()\n        {\n            FlowEmitterGenericVisitEdge edge\n                = new FlowEmitterGenericVisitEdge();\n            edge.Connect(null, null);\n            Entry = edge;\n        }\n    }\n}\n","src/Story/Npcs/FlowEmitterMerchant/Events/FlowEmitterGenericVisit/FlowEmitterGenericVisitTexts.cs":"namespace FluxForge.Story.FlowEmitterGenericVisit\n{\n    /// <summary>通用到访的纯对话文本。<\/summary>\n    internal static class FlowEmitterGenericVisitTexts\n    {\n        internal const string Greeting\n            = \"story.FlowEmitterGenericVisitTexts.Greeting\";\n\n        internal const string MoreItems\n            = \"story.FlowEmitterGenericVisitTexts.MoreItems\";\n    }\n}\n","src/Story/Npcs/FlowEmitterMerchant/Events/FlowEmitterSecondVisit/Edges/FlowEmitterSecondVisitGreetingEdge.cs":"using FluxForge.Story.FlowEmitterMerchant;\n\nnamespace FluxForge.Story.FlowEmitterSecondVisit\n{\n    /// <summary>第二次到访：介绍新货，并在手册说明后赠送手册。<\/summary>\n    internal sealed class FlowEmitterSecondVisitGreetingEdge : StoryEdge\n    {\n        internal FlowEmitterSecondVisitGreetingEdge()\n            : base(null, null)\n        {\n        }\n\n        internal override void Execute(StorySequence player)\n        {\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterSecondVisitTexts.Greeting));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterSecondVisitTexts.NewDevice));\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterSecondVisitTexts.ColdTrap));\n            player.Do(FlowEmitterMerchantStock.GiveManual);\n            player.SayNpc(ModHelper.GetLocalized(\"fluxforge\", FlowEmitterSecondVisitTexts.ExitLine));\n        }\n    }\n}\n","src/Story/Npcs/FlowEmitterMerchant/Events/FlowEmitterSecondVisit/FlowEmitterSecondVisitAssembly.cs":"using FluxForge.Story.FlowEmitterMerchant;\n\nnamespace FluxForge.Story.FlowEmitterSecondVisit\n{\n    /// <summary>第二次到访：介绍新货、赠送手册；正常结束时记录进度并上货。<\/summary>\n    internal sealed class FlowEmitterSecondVisitAssembly : StoryAssembly\n    {\n        internal override StoryEdge Entry { get; }\n\n        internal override void Complete()\n        {\n            FlowEmitterMerchantProgress.MarkSecondVisit();\n            FlowEmitterMerchantStock.PlaceSecondVisit();\n        }\n\n        internal FlowEmitterSecondVisitAssembly()\n        {\n            FlowEmitterSecondVisitGreetingEdge greeting\n                = new FlowEmitterSecondVisitGreetingEdge();\n\n            greeting.Connect(null, null);\n            Entry = greeting;\n        }\n    }\n}\n","src/Story/Npcs/FlowEmitterMerchant/Events/FlowEmitterSecondVisit/FlowEmitterSecondVisitTexts.cs":"namespace FluxForge.Story.FlowEmitterSecondVisit\n{\n    /// <summary>第二次到访的纯对话文本。<\/summary>\n    internal static class FlowEmitterSecondVisitTexts\n    {\n        internal const string Greeting\n            = \"story.FlowEmitterSecondVisitTexts.Greeting\";\n\n        internal const string NewDevice\n            = \"story.FlowEmitterSecondVisitTexts.NewDevice\";\n\n        internal const string ColdTrap\n            = \"story.FlowEmitterSecondVisitTexts.ColdTrap\";\n\n        internal const string ExitLine\n            = \"story.FlowEmitterSecondVisitTexts.ExitLine\";\n    }\n}\n","src/Story/Npcs/FlowEmitterMerchant/FlowEmitterMerchantProgress.cs":"using FluxForge.Mod;\n\nnamespace FluxForge.Story.FlowEmitterMerchant\n{\n    /// <summary>记录本剧情的到访与库存进度，不负责具体剧情分支。<\/summary>\n    internal static class FlowEmitterMerchantProgress\n    {\n        internal const string ArrivalSeenKey\n            = \"fluxforge.flowEmitterDemo.arrivalSeen\";\n\n        internal const string SecondVisitKey\n            = \"fluxforge.flowEmitterDemo.secondVisitDone\";\n\n        internal const string VisitCountKey\n            = \"fluxforge.flowEmitterDemo.visitCount\";\n\n        internal const string ThirdVisitKey\n            = \"fluxforge.flowEmitterDemo.thirdVisit\";\n\n        internal const string ManualGiftKey\n            = \"fluxforge.flowEmitterDemo.manualGift\";\n\n        internal static void MarkArrivalSeen()\n        {\n            PlayerStore.Instance.modData[ArrivalSeenKey] = \"true\";\n        }\n\n        internal static void MarkManualGift()\n        {\n            PlayerStore.Instance.modData[ManualGiftKey] = \"1\";\n        }\n\n        internal static bool HasManualGift\n        {\n            get\n            {\n                return PlayerStore.Instance.modData.ContainsKey(\n                    ManualGiftKey);\n            }\n        }\n\n        internal static void MarkSecondVisit()\n        {\n            PlayerStore.Instance.modData[SecondVisitKey] = \"1\";\n        }\n\n        internal static int VisitCount\n        {\n            get\n            {\n                string raw;\n                if (!PlayerStore.Instance.modData.TryGetValue(\n                    VisitCountKey,\n                    out raw))\n                {\n                    return 0;\n                }\n\n                return int.Parse(raw);\n            }\n        }\n\n        internal static void IncrementVisitCount()\n        {\n            int count = VisitCount + 1;\n            PlayerStore.Instance.modData[VisitCountKey]\n                = count.ToString();\n\n            if (count >= 3)\n            {\n                PlayerStore.Instance.modData[ThirdVisitKey] = \"1\";\n            }\n        }\n\n        internal static bool HasSecondVisit\n        {\n            get\n            {\n                return PlayerStore.Instance.modData.ContainsKey(\n                    SecondVisitKey);\n            }\n        }\n\n        internal static bool HasArrivalSeen\n        {\n            get\n            {\n                return PlayerStore.Instance.modData.ContainsKey(\n                    ArrivalSeenKey);\n            }\n        }\n    }\n}\n","src/Story/Npcs/FlowEmitterMerchant/FlowEmitterMerchantStock.cs":"namespace FluxForge.Story.FlowEmitterMerchant\n{\n    /// <summary>一条上货规则：可要求指定剧情标志，无标志要求时直接上货。<\/summary>\n    internal sealed class StoryStockRule\n    {\n        internal string StoryKey;\n        internal string ItemKey;\n        internal int Count;\n        internal bool Shabby;\n\n        internal StoryStockRule(\n            string storyKey,\n            string itemKey,\n            int count,\n            bool shabby)\n        {\n            StoryKey = storyKey;\n            ItemKey = itemKey;\n            Count = count;\n            Shabby = shabby;\n        }\n    }\n\n    /// <summary>按第二访清单或剧情标志上货，并提供赠礼和破旧状态适配。<\/summary>\n    internal static class FlowEmitterMerchantStock\n    {\n        private const string ManualItemKey = \"fluxforge_device_manual\";\n\n        private static readonly StoryStockRule[] SecondVisitRules =\n        {\n            new StoryStockRule(null, \"flow_cold_trap\", 1, false),\n            new StoryStockRule(null, \"flow_filter\", 1, false),\n            new StoryStockRule(null, \"flow_emitter\", 2, false),\n            new StoryStockRule(null, \"l_turn_device\", 4, false),\n            new StoryStockRule(null, \"flow_heater\", 1, false),\n            new StoryStockRule(null, \"flow_cooler\", 1, false),\n            new StoryStockRule(null, \"flow_straight_speed\", 2, false),\n        };\n\n        internal static void PlaceSecondVisit()\n        {\n            PlaceRules(SecondVisitRules);\n        }\n\n        private static readonly StoryStockRule[] RepeatRules =\n        {\n            new StoryStockRule(\n                FlowEmitterMerchantProgress.ArrivalSeenKey,\n                \"flow_emitter\",\n                2,\n                false),\n            new StoryStockRule(\n                FlowEmitterMerchantProgress.ArrivalSeenKey,\n                \"flow_filter\",\n                1,\n                false),\n            new StoryStockRule(\n                FlowEmitterMerchantProgress.SecondVisitKey,\n                \"flow_cold_trap\",\n                1,\n                false),\n            new StoryStockRule(\n                FlowEmitterMerchantProgress.SecondVisitKey,\n                \"flow_centrifuge\",\n                1,\n                false),\n            new StoryStockRule(\n                FlowEmitterMerchantProgress.ThirdVisitKey,\n                \"flow_straight_speed\",\n                2,\n                false),\n            new StoryStockRule(\n                FlowEmitterMerchantProgress.ThirdVisitKey,\n                \"l_turn_device\",\n                2,\n                false),\n            new StoryStockRule(\n                FlowEmitterMerchantProgress.ThirdVisitKey,\n                \"flow_straight\",\n                4,\n                false),\n        };\n\n        /// <summary>后续到访按进度上货；原版客户离店时清理桌上未归玩家所有的物品。<\/summary>\n        internal static void Refresh()\n        {\n            PlaceRules(RepeatRules);\n        }\n\n        /// <summary>第二次到访赠礼：流源手册直接放到前台，不计入售卖库存。<\/summary>\n        internal static void GiveManual()\n        {\n            GameItem manual = DirectoryMaster.Item(ManualItemKey);\n            GeneralHelper.SetItemOwned(manual, true);\n            GraphUtils.EmporiumTryAdd(\n                EmporiumEntry.Instance.frontInvinvElement,\n                manual);\n\n        }\n\n        private static void PlaceRules(StoryStockRule[] rules)\n        {\n            foreach (StoryStockRule rule in rules)\n            {\n                if (rule.StoryKey != null\n                    && !PlayerStore.Instance.modData.ContainsKey(\n                        rule.StoryKey))\n                {\n                    continue;\n                }\n\n                for (int i = 0; i < rule.Count; i++)\n                {\n                    AddStock(rule.ItemKey, rule.Shabby);\n                }\n            }\n        }\n\n        private static void AddStock(string itemKey, bool shabby)\n        {\n            GameItem item = DirectoryMaster.Item(itemKey);\n\n            if (shabby)\n            {\n                MarkShabby(item);\n            }\n\n            PlayerStore.Instance.AddDirectSellingItemToTable(item);\n        }\n\n        internal static void MarkShabby(GameItem item)\n        {\n            ItemFeatureHelper.SetShabby(item);\n\n            ItemFeature feature = item.FindItemFeatureByCategory(\n                \"CATEGORY_SHABBY\");\n\n            if (feature == null)\n            {\n                return;\n            }\n\n            int index = item.itemFeatures.IndexOf(feature);\n            if (index > 0)\n            {\n                item.itemFeatures.RemoveAt(index);\n                item.itemFeatures.Insert(0, feature);\n            }\n        }\n    }\n}\n","src/Story/Npcs/FlowEmitterMerchant/FlowEmitterMerchantStory.cs":"using FluxForge.Story.FlowEmitterArrival;\nusing FluxForge.Story.FlowEmitterGenericVisit;\nusing FluxForge.Story.FlowEmitterSecondVisit;\nusing FluxForge.Story.Portraits;\n\nnamespace FluxForge.Story.FlowEmitterMerchant\n{\n    /// <summary>奥雅的访客身份、到访规则和剧情事件注册。<\/summary>\n    internal static class FlowEmitterMerchantStory\n    {\n        internal static NpcStoryContent Create()\n        {\n            NpcDefinition definition = new NpcDefinition(\n                \"fluxforge_flow_emitter_demo\",\n                \"npc.oya.name\",\n                NpcPortraitRegistry.SpriteKey,\n                FlowEmitterMerchantProgress.VisitCountKey,\n                true);\n\n            VisitRule visit = new VisitRule(\n                \"flow_emitter.every_7_days\",\n                definition.Identifier,\n                10,\n                1d,\n                7,\n                VisitKind.Sell,\n                delegate { return true; },\n                FlowEmitterMerchantProgress.IncrementVisitCount);\n\n            StoryEvent arrival = new StoryEvent(\n                \"flow_emitter.arrival\",\n                definition.Identifier,\n                StoryTrigger.VisitStarted,\n                100,\n                0,\n                null,\n                delegate\n                {\n                    return !FlowEmitterMerchantProgress.HasArrivalSeen;\n                });\n\n            StoryEvent secondVisit = new StoryEvent(\n                \"flow_emitter.second_visit\",\n                definition.Identifier,\n                StoryTrigger.VisitStarted,\n                90,\n                1,\n                null,\n                delegate\n                {\n                    return FlowEmitterMerchantProgress.HasArrivalSeen\n                        && !FlowEmitterMerchantProgress.HasSecondVisit;\n                });\n\n            StoryEvent genericVisit = new StoryEvent(\n                \"flow_emitter.generic_visit\",\n                definition.Identifier,\n                StoryTrigger.VisitStarted,\n                10,\n                0,\n                null,\n                delegate { return true; });\n\n            return new NpcStoryContent(\n                definition,\n                new[] { visit },\n                new[]\n                {\n                    new StoryEventDefinition(\n                        arrival,\n                        new FlowEmitterArrivalAssembly(),\n                        StoryOutcome.Leave),\n                    new StoryEventDefinition(\n                        secondVisit,\n                        new FlowEmitterSecondVisitAssembly(),\n                        StoryOutcome.OpenShop),\n                    new StoryEventDefinition(\n                        genericVisit,\n                        new FlowEmitterGenericVisitAssembly(),\n                        StoryOutcome.OpenShop),\n                },\n                visit);\n        }\n    }\n}\n"},"textInventory":[{"key":"HospitalContractMaterialTexts.Greeting","text":"这周的原料到了。你清点一下。","source":["src/Story/Hospital/Events/HospitalContractMaterial/HospitalContractMaterialTexts.cs",5],"inGraph":true},{"key":"HospitalContractMilestoneTexts.At20_1","text":"制药师们很满意你提供的试剂。","source":["src/Story/Hospital/Events/HospitalContractMilestone/HospitalContractMilestoneTexts.cs",5],"inGraph":true},{"key":"HospitalContractMilestoneTexts.At20_2","text":"部分供货商的效率没你这高。","source":["src/Story/Hospital/Events/H s.cs",20],"inGraph":true},{"key":"HospitalSynaprestTexts.Ask2","text":"塞纳普斯原液的提纯完成了吗。","source":["src/Story/Hospital/Events/HospitalSynaprest/HospitalSynaprestTexts.cs",21],"inGraph":true},{"key":"HospitalSynaprestTexts.SubmitOption","text":"提交塞纳普斯原液。","source":["src/Story/Hospital/Events/HospitalSynaprest/HospitalSynaprestTexts.cs",22],"inGraph":true},{"key":"HospitalSynaprestTexts.Empty","text":"桌子上什么都没有，是不是搞错了。","source":["src/Story/Hospital/Events/HospitalSynaprest/HospitalSynaprestTexts.cs",23],"inGraph":true},{"key":"HospitalSynaprestTexts.Missing","text":"桌子上没有看到原液，是不是搞错了。","source":["src/Story/Hospital/Events/HospitalSynaprest/HospitalSynaprestTexts.cs",24],"inGraph":true},{"key":"HospitalSynaprestTexts.Impure","text":"看起来这些原液并不是100%浓度。","source":["src/Story/Hospital/Events/HospitalSynaprest/HospitalSynaprestTexts.cs",25],"inGraph":true},{"key":"HospitalSynaprestTexts.First1","text":"100%纯度的塞纳普斯原液！","source":["src/Story/Hospital/Events/HospitalSynaprest/HospitalSynaprestTexts.cs",26],"inGraph":true},{"key":"HospitalSynaprestTexts.First2","text":"制药师们找了好多办法都没办法解决污染问题都被你解决了！","source":["src/Story/Hospital/Events/HospitalSynaprest/HospitalSynaprestTexts.cs",27],"inGraph":true},{"key":"HospitalSynaprestTexts.First3","text":"相信你果然没有错！","source":["src/Story/Hospital/Events/HospitalSynaprest/HospitalSynaprestTexts.cs",28],"inGraph":true},{"key":"HospitalSynaprestTexts.AllAtOnce","text":"一次性就全部完成了，太厉害了！","source":["src/Story/Hospital/Events/HospitalSynaprest/HospitalSynaprestTexts.cs",29],"inGraph":true},{"key":"HospitalSynaprestTexts.FirstProgress","text":"现在已经完成{0}/550了，感谢你的帮助。","source":["src/Story/Hospital/Events/HospitalSynaprest/HospitalSynaprestTexts.cs",30],"inGraph":true},{"key":"HospitalSynaprestTexts.Progress","text":"原液进度{0}/550，非常感谢你的帮助。","source":["src/Story/Hospital/Events/HospitalSynaprest/HospitalSynaprestTexts.cs",31],"inGraph":true},{"key":"HospitalSynaprestTexts.Complete1","text":"所有原料的提纯都已经完成了。","source":["src/Story/Hospital/Events/HospitalSynaprest/HospitalSynaprestTexts.cs",32],"inGraph":true},{"key":"HospitalSynaprestTexts.Complete2","text":"制药师们会记住你的帮助。","source":["src/Story/Hospital/Events/HospitalSynaprest/HospitalSynaprestTexts.cs",33],"inGraph":true},{"key":"HospitalSynaprestTexts.Complete3","text":"按照约定，以后每周我都会带来报废的塞纳普斯原料。","source":["src/Story/Hospital/Events/HospitalSynaprest/HospitalSynaprestTexts.cs",34],"inGraph":true},{"key":"HospitalSynaprestTexts.CompleteContinue","text":"你还有其他想要交的试剂吗？","source":["src/Story/Hospital/Events/HospitalSynaprest/HospitalSynaprestTexts.cs",35],"inGraph":true},{"key":"AcidBuyerArrivalTexts.Line1","text":"（叹气）我收购的化学试剂总是带着较高的污染。","source":["src/Story/Npcs/AcidBuyer/Events/AcidBuyerArrival/AcidBuyerArrivalTexts.cs",6],"inGraph":true},{"key":"AcidBuyerArrivalTexts.Line2","text":"我想要高浓度的酸或碱，浓度越高越好。","source":["src/Story/Npcs/AcidBuyer/Events/AcidBuyerArrival/AcidBuyerArrivalTexts.cs",9],"inGraph":true},{"key":"AcidBuyerArrivalTexts.Line3","text":"有九十以上浓度的酸或碱可以卖给我吗？","source":["src/Story/Npcs/AcidBuyer/Events/AcidBuyerArrival/AcidBuyerArrivalTexts.cs",12],"inGraph":true},{"key":"AcidBuyerArrivalTexts.Line4","text":"或者你拿我这批试剂处理也可以，我不想把它们带回去。","source":["src/Story/Npcs/AcidBuyer/Events/AcidBuyerArrival/AcidBuyerArrivalTexts.cs",15],"inGraph":true},{"key":"AcidBuyerArrivalTexts.PriceIntro","text":"你放在桌上就行。","source":["src/Story/Npcs/AcidBuyer/Events/AcidBuyerArrival/AcidBuyerArrivalTexts.cs",18],"inGraph":true},{"key":"AcidBuyerArrivalTexts.PriceStep","text":"浓度越高越好，有接近100%浓度的试剂，我会提供额外报酬。","source":["src/Story/Npcs/AcidBuyer/Events/AcidBuyerArrival/AcidBuyerArrivalTexts.cs",21],"inGraph":true},{"key":"AcidBuyerArrivalTexts.PricePure","text":"你这有吗？","source":["src/Story/Npcs/AcidBuyer/Events/AcidBuyerArrival/AcidBuyerArrivalTexts.cs",24],"inGraph":true},{"key":"AcidBuyerArrivalTexts.TradeOption","text":"放在桌上了。","source":["src/Story/Npcs/AcidBuyer/Events/AcidBuyerArrival/AcidBuyerArrivalTexts.cs",27],"inGraph":true},{"key":"AcidBuyerArrivalTexts.ExitOption","text":"我这没有","s
