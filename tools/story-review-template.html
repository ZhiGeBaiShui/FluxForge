<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FluxForge · 剧情审阅室</title>
<style>
:root{color-scheme:dark;--bg:#15171c;--panel:#202229;--muted:#a1a39e;--ink:#eee9d9;--line:#393b42;--accent:#c7b687;--teal:#91b8b2;--purple:#a99ab4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;line-height:1.7}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:3px}button:disabled{opacity:.35;cursor:default}a{color:var(--teal)}
.shell{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:#1a1c22;padding:30px 20px}.brand{font-family:Georgia,serif;font-size:27px;letter-spacing:3px;color:var(--accent)}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:10px;color:var(--muted)}.sidebar h1{font-size:18px;font-weight:500;margin:3px 0 20px}.search{width:100%;background:#14161b;border:1px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:4px;margin-bottom:16px}.tabs{display:flex;gap:5px;margin-bottom:18px}.tabs button{flex:1;background:transparent;border:1px solid var(--line);padding:7px 0;font-size:12px}.tabs button.active{background:var(--accent);color:#24242a;border-color:var(--accent)}.group{color:var(--accent);font-size:11px;letter-spacing:2px;margin:22px 8px 9px}.nav-item{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:4px;padding:9px 10px;margin:3px 0;color:#c4c4bd;font-size:12px}.nav-item:hover{background:#272a30}.nav-item.active{border-color:#5e6060;background:#2b2d31;color:var(--ink)}.nav-item small{display:block;color:var(--muted);font-size:10px}.side-note{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.main{min-width:0;padding:28px 44px 60px;max-width:1500px;width:100%;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:26px}.top-actions{display:flex;gap:8px}.ghost{background:transparent;border:1px solid var(--line);padding:7px 13px;border-radius:4px;font-size:12px}.ghost:hover{border-color:var(--accent)}.subtitle{font-size:11px;color:var(--muted)}.crumb{color:var(--muted);font-size:11px;margin-bottom:12px;overflow-wrap:anywhere}.kicker{color:var(--teal);font-size:11px;letter-spacing:2px}.title{font-family:Georgia,"Microsoft YaHei",serif;font-size:29px;line-height:1.4;font-weight:500;margin:8px 0 18px}.lede{color:#b6b7af;max-width:760px;margin-bottom:26px}.home-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.chapter-card{background:var(--panel);border:1px solid var(--line);text-align:left;padding:20px;display:flex;gap:18px;align-items:center;border-radius:6px;min-height:140px}.chapter-card:hover{border-color:var(--accent);transform:translateY(-1px)}.chapter-card img{width:88px;height:100px;object-fit:contain;image-rendering:pixelated;align-self:flex-end}.chapter-card strong{font-weight:500;font-size:15px}.chapter-card small{display:block;color:var(--muted);font-size:11px;margin-top:8px}.pill{display:inline-block;font-size:10px;color:var(--teal);background:#263534;padding:2px 8px;border-radius:3px;margin-bottom:8px}.trigger{border-left:2px solid var(--teal);background:#222b2b;padding:15px 18px;margin-bottom:24px;font-size:12px;color:#c0cec6}.trigger b{display:block;font-size:10px;color:var(--teal);letter-spacing:2px;margin-bottom:5px}.scene{display:grid;grid-template-columns:235px minmax(0,1fr);background:#24252d;border:1px solid #49464d;border-radius:6px;overflow:hidden;margin-bottom:24px;min-height:320px}.portrait-panel{position:relative;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(ellipse at center bottom,#46414b 0,#2a2c32 60%,#22242b 100%);border-right:1px solid #44434a;padding:35px 4px 0;min-height:300px}.portrait-panel:before{content:"";position:absolute;inset:16px;border:1px solid #56515b;pointer-events:none}.portrait{width:230px;height:270px;object-fit:contain;image-rendering:pixelated;position:relative;z-index:1}.speaker-tab{position:absolute;top:23px;left:26px;font-size:11px;letter-spacing:2px;color:var(--accent)}.dialogue{padding:28px 30px;align-self:center;min-width:0}.dialogue p{margin:0 0 15px;font-size:16px;line-height:1.9}.dialogue p:last-child{margin-bottom:0}.dialogue .system{color:#beb4c8;font-style:italic}.empty-dialogue{font-size:13px!important;color:var(--muted)}.section-label{font-size:10px;letter-spacing:2px;color:var(--muted);margin:24px 0 10px}.notes{background:#1c2026;border:1px solid var(--line);padding:12px 18px;border-radius:4px;font-size:12px;color:#b5b8b1}.notes p{margin:6px 0;white-space:pre-wrap}.option{margin:10px 0;border:1px solid #45464b;border-radius:5px;overflow:hidden}.option-button{width:100%;background:#292c32;border:0;text-align:left;padding:15px 18px;display:flex;align-items:center;gap:12px}.option-button:hover{background:#32353b}.type{font-size:10px;flex-shrink:0;border:1px solid #626052;color:var(--accent);padding:1px 6px;border-radius:2px}.type.auto{color:var(--teal);border-color:#486660}.option-label{flex:1}.chevron{color:var(--muted);transition:transform .2s}.option-button[aria-expanded=true] .chevron{transform:rotate(90deg)}.routes{padding:10px;background:#1d2026;border-top:1px solid var(--line)}.routes[hidden]{display:none}.route{display:block;width:100%;background:#292f32;border:1px solid #40514e;text-align:left;border-radius:3px;padding:13px 15px;margin:6px 0}.route:hover{border-color:var(--teal);background:#303a3a}.route .cond{color:#d4dfd4;display:block}.route .effect{color:var(--muted);font-size:11px;display:block;margin-top:5px}.route .destination{color:var(--teal);font-size:11px;display:block;margin-top:8px}.end{padding:22px;border:1px dashed #5c584c;border-radius:5px;color:var(--accent);font-size:13px}.sources{margin-top:25px;font-size:11px;color:var(--muted)}.source-button{display:block;background:transparent;border:0;padding:4px 0;text-align:left;color:#9aa8af;font-size:11px;overflow-wrap:anywhere}.source-button:hover{color:var(--teal);text-decoration:underline}.rule-card{background:var(--panel);border:1px solid var(--line);padding:24px;margin-bottom:16px;border-radius:5px}.rule-card h3{font-size:17px;font-weight:500;margin:0 0 12px;color:var(--accent)}.rule-card p{font-size:13px;color:#c3c4ba}.inventory-item{padding:16px;border-bottom:1px solid var(--line)}.inventory-item code{font-size:10px;color:var(--muted);overflow-wrap:anywhere}.inventory-item p{margin:8px 0}.notice{padding:14px 18px;background:#2b2931;border:1px solid #544b5d;font-size:12px;color:#cbbfd1;margin-bottom:24px;border-radius:4px}.footer{font-size:10px;color:var(--muted);margin-top:30px}dialog{width:min(1000px,94vw);max-height:85vh;background:#20232a;color:var(--ink);border:1px solid #69635c;border-radius:6px;padding:20px}dialog::backdrop{background:#000b}.modal-bar{display:flex;justify-content:space-between;align-items:center;gap:12px}dialog pre{font:12px/1.75 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;padding:15px;background:#15171c;max-height:65vh;overflow:auto}.source-name{font-size:12px;overflow-wrap:anywhere}.mobile-menu{display:none}.metrics{display:flex;gap:25px;margin:20px 0 25px}.metrics strong{font:26px Georgia,serif;color:var(--accent)}.metrics span{font-size:11px;color:var(--muted);margin-left:7px}
@media(min-width:1500px){.main{padding-right:70px;padding-left:70px}}@media(max-width:1000px){.shell{grid-template-columns:245px minmax(0,1fr)}.sidebar{padding:24px 14px}.main{padding:22px}.scene{grid-template-columns:180px minmax(0,1fr)}.portrait{width:176px;height:230px}.dialogue{padding:22px}.home-cards{grid-template-columns:1fr}}
@media(max-width:700px){.shell{display:block}.sidebar{position:relative;height:auto;padding:17px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:21px}.sidebar h1{margin:0 0 10px;font-size:15px}.side-note{display:none}.sidebar .search{margin-bottom:10px}.tabs{margin-bottom:0}#nav{display:none;max-height:320px;overflow:auto}#nav.open{display:block}.mobile-menu{display:inline-block}.main{padding:18px 14px 40px}.topbar{padding-bottom:14px;margin-bottom:20px}.top-actions{flex-wrap:wrap}.title{font-size:23px}.scene{grid-template-columns:1fr}.portrait-panel{min-height:210px;max-height:235px;border-right:0;border-bottom:1px solid #44434a}.portrait{height:215px;width:215px}.dialogue{padding:22px}.dialogue p{font-size:15px}.chapter-card{padding:15px;min-height:120px}.chapter-card img{width:75px;height:90px}.metrics{gap:12px}.metrics strong{font-size:22px}.metrics span{font-size:10px}.topbar>.subtitle{display:none}}
@media print{.sidebar,.topbar,.options,.sources,.footer{display:none}.shell{display:block}.main{padding:0}.scene{break-inside:avoid}body{background:white;color:black}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar"><div class="eyebrow">Narrative review / FluxForge</div><div class="brand">FLUXFORGE</div><h1>剧情审阅室</h1><input class="search" id="search" placeholder="搜索剧情、台词或条件…" aria-label="搜索剧情"><div class="tabs"><button data-tab="chapters" class="active">剧情目录</button><button data-tab="nodes">全部节点</button><button data-tab="rules">规则</button><button data-tab="texts">台词</button></div><button class="ghost mobile-menu" id="toggle-nav">展开 / 收起目录</button><nav id="nav" aria-label="剧情导航"></nav><div class="side-note">① 点击玩家选项<br>② 展开可触发的条件<br>③ 点击条件，进入对应剧情<br><br>所有图片、台词及源码依据均内置。可离线打开，也可直接发送此HTML文件。</div></aside>
<main class="main"><div class="topbar"><div class="top-actions"><button id="back" class="ghost">← 返回上一段</button><button id="forward" class="ghost">下一段 →</button><button id="home" class="ghost">剧情总览</button></div><div class="subtitle" id="snapshot"></div></div><div id="content" aria-live="polite"></div><div class="footer" id="footer"></div></main>
</div>
<dialog id="source-modal"><div class="modal-bar"><span id="source-name" class="source-name"></span><button class="ghost" id="close-source">关闭 ×</button></div><pre id="source-code"></pre></dialog>
<script>
const DATA=/*__STORY_DATA__*/;
const names={oya:'奥雅',vera:'薇拉',visitor1:'中心医院访客 01',visitor2:'中心医院访客 02',visitor3:'中心医院访客 03',visitor4:'中心医院访客 04'};
const content=document.getElementById('content');
const nav=document.getElementById('nav');
let tab='chapters';
let timeline=[{id:'home',chapter:null,via:''}];
let position=0;
function esc(value){return String(value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function plain(value){return value.replace(/<\/?color(?:=[^>]+)?>/g,'')}
function sourceButtons(paths){return paths.map(function(p){return '<button class="source-button" data-source="'+esc(p)+'">↗ '+esc(p)+'</button>'}).join('')}
function current(){return timeline[position]}
function navigate(id,chapter,via){timeline=timeline.slice(0,position+1);timeline.push({id:id,chapter:chapter===undefined?current().chapter:chapter,via:via||''});position++;render();window.scrollTo({top:0,behavior:'smooth'})}
function allSourcePaths(n){const paths=n.source.slice();n.lines.forEach(function(l){if(paths.indexOf(l.source[0])<0)paths.push(l.source[0])});return paths}
function updateControls(){document.getElementById('back').disabled=position===0;document.getElementById('forward').disabled=position>=timeline.length-1}
function renderNav(){const q=document.getElementById('search').value.trim().toLowerCase();nav.innerHTML='';document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab)});
 const items=tab==='chapters'?DATA.chapters:tab==='nodes'?Object.values(DATA.nodes):[];
 items.forEach(function(item,index){const id=tab==='chapters'?item.entry:item.id;const n=DATA.nodes[id];const text=(item.title+' '+(item.trigger||'')+' '+n.lines.map(function(l){return l.text}).join(' ')).toLowerCase();if(q&&text.indexOf(q)<0)return;
 const b=document.createElement('button');b.className='nav-item'+(current().id===id?' active':'');b.innerHTML=esc(item.title)+'<small>'+esc(names[item.npc]||'系统')+'</small>';b.onclick=function(){navigate(id,tab==='chapters'?index:null);nav.classList.remove('open')};nav.appendChild(b)});
 if(tab==='rules'||tab==='texts'){const p=document.createElement('p');p.className='subtitle';p.textContent=tab==='rules'?'右侧显示当前实现的触发与结算规则。':'右侧列出源码中的对白与选项；可用搜索框筛选。';nav.appendChild(p)}
 if(q&&items.length&&!nav.children.length){nav.innerHTML='<p class="subtitle">未找到匹配剧情，试试“全部节点”或“台词”。</p>'}}
function renderHome(){let html='<div class="kicker">CURRENT STORY / 当前源码快照</div><h2 class="title">每一次到访，都有来由。</h2><p class="lede">从奥雅的流源工艺邀请，到薇拉与中心医院的长期合作。选择一个章节，沿着玩家选项和触发条件，查看完整对话与分支。</p><div class="metrics"><div><strong>'+DATA.stats.chapters+'</strong><span>剧情入口</span></div><div><strong>'+DATA.stats.nodes+'</strong><span>审阅节点</span></div><div><strong>6</strong><span>NPC 贴图</span></div></div><div class="notice">本页收录当前已实现内容。100声望赛纳普斯最终主线、奥雅原料后续尚在讨论，未加入现有剧情。条件按钮是审阅导航，不是额外的游戏选项。</div><div class="home-cards">';DATA.chapters.forEach(function(c,i){html+='<button class="chapter-card" data-chapter="'+i+'"><img src="'+DATA.portraits[c.npc]+'" alt="'+esc(names[c.npc])+'"><div><span class="pill">'+esc(names[c.npc])+'</span><br><strong>'+esc(c.title)+'</strong><small>'+esc(c.trigger.slice(0,95))+(c.trigger.length>95?'…':'')+'</small></div></button>'});content.innerHTML=html+'</div>';content.querySelectorAll('[data-chapter]').forEach(function(b){b.onclick=function(){const i=Number(b.dataset.chapter);navigate(DATA.chapters[i].entry,i)}})}
function renderNode(){const item=current();const n=DATA.nodes[item.id];let html='<div class="crumb">'+esc(timeline.slice(0,position).filter(function(t){return DATA.nodes[t.id]}).slice(-3).map(function(t){return DATA.nodes[t.id].title}).join(' / ')||'剧情目录')+'</div><div class="kicker">'+esc(names[n.npc])+' / STORY '+String(Object.keys(DATA.nodes).indexOf(n.id)+1).padStart(2,'0')+'</div><h2 class="title">'+esc(n.title)+'</h2>';
 if(item.chapter!==null&&DATA.chapters[item.chapter].entry===item.id){html+='<div class="trigger"><b>触发条件'+(DATA.chapters[item.chapter].priority?' · 优先级 '+DATA.chapters[item.chapter].priority:'')+'</b>'+esc(DATA.chapters[item.chapter].trigger)+'</div>'}
 if(item.via){html+='<div class="trigger"><b>本次进入条件</b>'+esc(item.via)+'</div>'}
 html+='<div class="scene"><div class="portrait-panel"><span class="speaker-tab">'+esc(names[n.npc])+'</span><img class="portrait" src="'+DATA.portraits[n.npc]+'" alt="'+esc(names[n.npc])+'的游戏贴图"></div><div class="dialogue">';
 if(n.lines.length){n.lines.forEach(function(l){html+='<p'+(n.system?' class="system"':'')+'>'+esc(plain(l.text))+'</p>'})}else{html+='<p class="empty-dialogue">'+(n.options.length?'此处为选择或条件检查节点，不新增游戏对白。':'此处没有项目新增对白。')+'</p>'}
 html+='</div></div>';
 if(n.notes.length){html+='<div class="section-label">行为与设计说明</div><div class="notes">'+n.notes.map(function(t){return '<p>'+esc(t)+'</p>'}).join('')+'</div>'}
 html+='<div class="options"><div class="section-label">'+(n.options.length?'点击选项展开条件，再点击条件跳转':'本段到此结束')+'</div>';
 n.options.forEach(function(o,i){const isChoice=o.kind==='choice';const type=isChoice?'玩家选项':o.kind==='condition'?'条件分支':o.kind==='reference'?'审阅资料':'流程导航';html+='<div class="option"><button class="option-button" data-option="'+i+'" aria-expanded="false" aria-controls="routes-'+i+'"><span class="type '+(isChoice?'':'auto')+'">'+type+'</span><span class="option-label">'+esc(o.label)+'</span><span class="chevron">›</span></button><div class="routes" id="routes-'+i+'" hidden>';o.routes.forEach(function(r,j){html+='<button class="route" data-option-index="'+i+'" data-route="'+j+'"><span class="cond">'+esc(r.condition)+'</span>'+(r.effect?'<span class="effect">'+esc(r.effect)+'</span>':'')+'<span class="destination">进入：'+esc(DATA.nodes[r.target].title)+' →</span></button>'});html+='</div></div>'});
 if(!n.options.length){html+='<div class="end">本段结束。可以返回上一段比较其他分支，或从目录选择下一次来访。</div>'}
 html+='</div><details class="sources"><summary>查看本段源码依据（随HTML内置）</summary>'+sourceButtons(allSourcePaths(n))+'</details>';content.innerHTML=html;
 content.querySelectorAll('[data-option]').forEach(function(b){b.onclick=function(){const box=document.getElementById('routes-'+b.dataset.option);box.hidden=!box.hidden;b.setAttribute('aria-expanded',String(!box.hidden))}});
 content.querySelectorAll('[data-route]').forEach(function(b){b.onclick=function(){const o=n.options[Number(b.dataset.optionIndex)];const r=o.routes[Number(b.dataset.route)];navigate(r.target,undefined,o.label+' → '+r.condition)}})
}
function renderRules(){content.innerHTML='<div class="kicker">SYSTEM / 当前规则</div><h2 class="title">触发、周期与结算</h2>'+DATA.rules.map(function(r){return '<article class="rule-card"><h3>'+esc(r.title)+'</h3><p>'+esc(r.body)+'</p>'+sourceButtons(r.source)+'</article>'}).join('')}
function renderTexts(){const q=document.getElementById('search').value.trim().toLowerCase();const all=DATA.textInventory.filter(function(t){return !q||(t.key+' '+t.text).toLowerCase().indexOf(q)>=0});content.innerHTML='<div class="kicker">SCRIPT / 源码文字索引</div><h2 class="title">对白与玩家选项</h2><p class="lede">逐字提取当前文本常量，保留原标点。此索引也含声望面板标识；玩家对白请以剧情节点的角色与分支为准。共 '+all.length+' 项。</p>'+all.map(function(t){return '<div class="inventory-item"><code>'+esc(t.key)+'</code><p>'+esc(plain(t.text))+'</p>'+sourceButtons([t.source[0]])+'</div>'}).join('')}
function bindSources(){content.querySelectorAll('[data-source]').forEach(function(b){b.onclick=function(){document.getElementById('source-name').textContent=b.dataset.source;document.getElementById('source-code').textContent=DATA.sources[b.dataset.source];document.getElementById('source-modal').showModal()}})}
function render(){updateControls();renderNav();if(tab==='rules')renderRules();else if(tab==='texts')renderTexts();else if(current().id==='home')renderHome();else renderNode();bindSources()}
document.getElementById('back').onclick=function(){if(position>0){position--;if(tab==='rules'||tab==='texts')tab='chapters';render()}};
document.getElementById('forward').onclick=function(){if(position<timeline.length-1){position++;if(tab==='rules'||tab==='texts')tab='chapters';render()}};
document.getElementById('home').onclick=function(){tab='chapters';navigate('home',null)};
document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;render()}});
document.getElementById('search').oninput=function(){renderNav();if(tab==='texts'){renderTexts();bindSources()}};
document.getElementById('toggle-nav').onclick=function(){nav.classList.toggle('open')};
document.getElementById('close-source').onclick=function(){document.getElementById('source-modal').close()};
document.getElementById('source-modal').addEventListener('click',function(e){if(e.target===this)this.close()});
document.addEventListener('keydown',function(e){if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();document.getElementById('back').click()}if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();document.getElementById('forward').click()}});
document.getElementById('snapshot').textContent='源码快照 · '+DATA.built;
document.getElementById('footer').textContent='FluxForge · 剧情审阅资料 / '+DATA.built+' / 单文件离线版本';
render();
</script>
</body>
</html>
